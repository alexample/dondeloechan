<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dónde lo Echan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: listing guide de jornada — cabecera tipo marcador, partidos agrupados por día, ficha inferior al tocar */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --ink:#14201A; --muted:#5E6B63; --line:#DCE2DA;
  --accent:#D9480F; --pitch:#1F5E3B; --pitch-ink:#F2F4EF;
  --live:#C92A2A; --done:#8A958E; --warn:#9A6700; --warn-bg:#FBF1D9;
  --op-m:#1C4E80; --op-m-bg:#E3ECF5; --op-dazn:#262626; --op-dazn-bg:#ECECEA;
  --op-free:#2B7A3D; --op-free-bg:#E2F0E4; --op-orange:#A14A00; --op-orange-bg:#F7E9DC;
  --shadow:0 18px 40px rgba(20,32,26,.18);
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1511; --surface:#16211B; --ink:#E9EFE9; --muted:#9AA79F; --line:#26332B;
  --accent:#FF7A3D; --pitch:#123A25; --pitch-ink:#E9EFE9;
  --live:#FF6B6B; --done:#6E7B73; --warn:#F2C25B; --warn-bg:#3A2E10;
  --op-m:#9CC3EC; --op-m-bg:#1A2A3A; --op-dazn:#E8E8E4; --op-dazn-bg:#2A2D2B;
  --op-free:#8DD69C; --op-free-bg:#183222; --op-orange:#FFB577; --op-orange-bg:#3A2614;
  --shadow:0 18px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1511; --surface:#16211B; --ink:#E9EFE9; --muted:#9AA79F; --line:#26332B;
  --accent:#FF7A3D; --pitch:#123A25; --pitch-ink:#E9EFE9;
  --live:#FF6B6B; --done:#6E7B73; --warn:#F2C25B; --warn-bg:#3A2E10;
  --op-m:#9CC3EC; --op-m-bg:#1A2A3A; --op-dazn:#E8E8E4; --op-dazn-bg:#2A2D2B;
  --op-free:#8DD69C; --op-free-bg:#183222; --op-orange:#FFB577; --op-orange-bg:#3A2614;
  --shadow:0 18px 40px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pitch)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{background:var(--pitch);color:var(--pitch-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .wrap{padding-block:14px 12px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.brand h1 span{color:var(--accent)}
.brand .jor{white-space:nowrap;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;text-align:right}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:rgba(255,255,255,.08);border-radius:10px;padding:3px;gap:3px}
.tabs button{appearance:none;border:0;background:transparent;color:inherit;font-family:var(--f-display);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0;padding:7px 9px;white-space:nowrap;flex:1 0 auto;border-radius:8px;cursor:pointer;line-height:1.1}
.tabs::-webkit-scrollbar{display:none}
.tabs.mas{-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
.tabs button small{display:block;font-family:var(--f-body);font-weight:500;font-size:9.5px;white-space:nowrap;text-transform:none;letter-spacing:0;opacity:.75}
.tabs button[aria-selected="true"]{background:var(--pitch-ink);color:var(--pitch)}
.tabs button:focus-visible,.match:focus-visible,.close:focus-visible,.search input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{position:relative}
.search input{width:100%;border:0;border-radius:10px;padding:10px 12px 10px 36px;font:inherit;font-size:15px;background:rgba(255,255,255,.12);color:var(--pitch-ink)}
.search input::placeholder{color:var(--pitch-ink);opacity:.6}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.7}

.fresh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding-top:12px}
.fresh .dot{width:8px;height:8px;border-radius:50%;background:var(--op-free);flex:none}
.fresh.stale .dot{background:var(--warn)}

main .wrap{padding-block:0 40px;display:flex;flex-direction:column;gap:20px}
.day h2{margin:12px 0 8px;font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:flex;align-items:center;gap:10px}
.day h2::after{content:"";flex:1;height:1px;background:var(--line)}
.list{display:flex;flex-direction:column;gap:8px}

.match{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font:inherit;color:inherit;transition:transform .12s ease,border-color .12s}
.match:hover{border-color:var(--muted)}
.match:active{transform:scale(.99)}
.match.past{opacity:.72}
.team .star{font-style:normal;color:var(--accent);margin-right:4px}
.compl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fav{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;min-height:34px}
.fav[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.fav:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.day.pasado h2{opacity:.65}
.day h2 .hoyd{font-style:normal;color:var(--accent);letter-spacing:.06em}
.match.ahora{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.hoy{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:15;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:10px 18px;background:var(--pitch);color:var(--pitch-ink);font:inherit;font-weight:700;font-size:14px;box-shadow:var(--shadow);cursor:pointer}
[hidden]{display:none!important}
.hoy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kick{display:flex;flex-direction:column;align-items:center;gap:2px;border-right:1px dashed var(--line);padding-right:10px;text-align:center}
.kick b{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.kick span{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kick span.live{color:var(--live)} .kick span.done{color:var(--done)} .kick span.off{color:var(--warn)}
.kick b.sc{font-size:22px;letter-spacing:0;white-space:nowrap}
.vs .mid.score{font-size:40px;color:var(--ink);line-height:1;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.vs .mid.score i{font-style:normal;color:var(--muted);font-size:26px}
.vs .mid.score.live{color:var(--live)}
.teams{display:flex;flex-direction:column;gap:6px;min-width:0}
.team{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.team .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}

.crest{flex:none;width:26px;height:26px;border-radius:50% 50% 46% 46%/42% 42% 58% 58%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:9px;letter-spacing:0;color:#fff;position:relative;overflow:hidden}
.crest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--surface)}
.crest.lg{width:64px;height:64px;font-size:20px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px 3px 4px;border-radius:999px;line-height:1.2;white-space:nowrap}
.chip .lg{display:inline-grid;place-items:center;min-width:20px;height:16px;padding:0 4px;border-radius:4px;font-family:var(--f-display);font-weight:800;font-size:10px;letter-spacing:.02em}
.chip .dial{font-family:var(--f-mono);font-weight:500;opacity:.8}
.chip.pend{background:var(--warn-bg);color:var(--warn);padding-left:8px}
.op-m{background:var(--op-m-bg);color:var(--op-m)} .op-m .lg{background:var(--op-m);color:var(--op-m-bg)}
.op-dazn{background:var(--op-dazn-bg);color:var(--op-dazn)} .op-dazn .lg{background:var(--op-dazn);color:var(--op-dazn-bg)}
.op-free{background:var(--op-free-bg);color:var(--op-free)} .op-free .lg{background:var(--op-free);color:var(--op-free-bg)}
.op-orange{background:var(--op-orange-bg);color:var(--op-orange)} .op-orange .lg{background:var(--op-orange);color:var(--op-orange-bg)}

.empty{padding:40px 8px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink);font-size:16px}
.skel{height:92px;border-radius:12px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--line),transparent);animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* Clasificación en la ficha */
.tabla{--z1:#2F8A57;--z2:#8DBF9F;--z3:var(--live)}
.tb-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tb-h .sec-t{margin-bottom:6px}
.tb-j{font-size:11.5px;color:var(--muted)}
.tabla table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tabla th{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;padding:0 6px 6px;border-bottom:1px solid var(--line)}
.tabla th.eq{text-align:left}
.tabla td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);color:var(--muted)}
.tabla tr:last-child td{border-bottom:0}
.tabla td.ps{width:26px;text-align:center;font-family:var(--f-mono);font-size:12px;box-shadow:inset 3px 0 0 var(--z,transparent)}
.tabla td.eq{text-align:left;color:var(--ink);max-width:0;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabla td.pt{font-weight:700;color:var(--ink);width:34px}
.tabla td.dg,.tabla td.pj{width:30px}
.tabla tr.z1{--z:var(--z1)} .tabla tr.z2{--z:var(--z2)} .tabla tr.z3{--z:var(--z3)}
.tabla tr.yo td{background:color-mix(in srgb,var(--accent) 9%,transparent);color:var(--ink)}
.tabla tr.yo td.eq{font-weight:700}
.tabla tr.yo td.ps{color:var(--accent);font-weight:700}
.tabla tr.gap td{padding:2px 6px;text-align:center;color:var(--muted);opacity:.6;letter-spacing:.3em;font-size:11px}
.tb-pie{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.ley{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.ley i{display:inline-block;width:3px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tb-ver{appearance:none;border:0;background:none;color:var(--accent);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 0}
.tb-ver:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* Ficha del partido */
.scrim{position:fixed;inset:0;background:rgba(10,16,12,.5);z-index:20;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);max-height:88%;overflow:auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none}
.sheet .wrap{display:flex;flex-direction:column;gap:18px;padding-block:10px 0}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh-head .comp{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.close{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;line-height:1}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.vs .side b{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.05;text-transform:uppercase;text-wrap:balance}
.vs .mid{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--muted)}
.when{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.when div{padding:12px;display:flex;flex-direction:column;gap:2px}
.when div+div{border-left:1px solid var(--line)}
.when small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.when b{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
.when em{font-style:normal;font-size:13px;color:var(--muted)}
.count{font-size:13px;font-weight:600;color:var(--accent)}
.sec-t{margin:0 0 8px;font-family:var(--f-display);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.ch{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:12px;margin-bottom:8px}
.ch .logo{width:48px;height:36px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.02em;overflow:hidden}
.ch .logo img{width:100%;height:100%;object-fit:contain}
.ch .info{min-width:0;display:flex;flex-direction:column;gap:2px}
.ch .info b{font-size:15px}
.ch .info span{font-size:12.5px;opacity:.85}
.ch .dialbox{text-align:center;font-family:var(--f-mono);line-height:1.1}
.ch .dialbox small{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.ch .dialbox b{font-size:22px}
.ch .dialbox em{display:block;font-style:normal;font-size:10px;opacity:.75;margin-top:3px}
.ch.op-m .logo{background:var(--op-m);color:var(--op-m-bg)}
.ch.op-dazn .logo{background:var(--op-dazn);color:var(--op-dazn-bg)}
.ch.op-free .logo{background:var(--op-free);color:var(--op-free-bg)}
.ch.op-orange .logo{background:var(--op-orange);color:var(--op-orange-bg)}
.ch.main{outline:2px solid currentColor;outline-offset:-2px}
.ch .tag{align-self:flex-start;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;margin:0}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.acciones{display:flex;flex-wrap:wrap;gap:8px}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:0;background:var(--pitch);color:var(--pitch-ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;flex:1 1 auto}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#comentarios{min-height:0}
#comentarios:not(:empty){border-top:1px solid var(--line);padding-top:14px}
.aviso{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px)}
.aviso.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.match{transition:none}.skel::after{animation:none}}
/* ---------- Escritorio: cabecera en una línea, lista a la izquierda y ficha fija a la derecha ---------- */
.match{scroll-margin-top:calc(var(--cab,0px) + 12px)}
.panel-vacio{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:28px 4px;color:var(--muted)}
.panel-vacio b{font-family:var(--f-display);font-size:22px;text-transform:uppercase;color:var(--ink)}
.panel-vacio kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink)}
@media (min-width:1024px){
  :root{--panel:520px;--cont:min(1320px,calc(100vw - 48px))}
  .wrap{max-width:1320px;padding-left:24px;padding-right:24px}
  header.top .wrap{display:grid;grid-template-columns:auto minmax(0,1fr) 300px;align-items:center;gap:24px;padding-block:14px}
  .brand{gap:16px;align-items:center}
  .brand h1{font-size:28px;white-space:nowrap}
  .tabs{background:transparent;padding:0;gap:6px}
  .tabs button{flex:0 0 auto;padding:8px 14px;background:rgba(255,255,255,.08)}
  .tabs button:hover{background:rgba(255,255,255,.16)}
  .tabs button[aria-selected="true"]:hover{background:var(--pitch-ink)}
  main .wrap{padding-right:calc(var(--panel) + 48px);padding-block:8px 60px}
  .day h2{position:sticky;top:var(--cab,0px);z-index:2;background:var(--bg);margin:0;padding:12px 0 8px}
  .match{grid-template-columns:72px 1fr}
  .match:hover{border-color:var(--pitch)}
  .match.sel{border-color:var(--pitch);box-shadow:0 0 0 2px var(--pitch) inset}
  .match.ahora.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
  .scrim{display:none!important}
  .sheet{left:auto;right:calc((100vw - var(--cont))/2);top:calc(var(--cab,96px) + 16px);bottom:16px;width:var(--panel);max-height:none;border-radius:16px;border:1px solid var(--line);transform:none!important;transition:none;box-shadow:0 10px 30px rgba(20,32,26,.10);padding-bottom:0}
  .sheet .wrap{padding:22px 26px 26px;max-width:none}
  .grab{display:none}
  .hoy{left:calc((100vw - var(--cont))/2 + (var(--cont) - var(--panel) - 24px)/2)}
}

</style>
<script src="config.js"></script>
</body>
</html>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Dónde lo <span>echan</span></h1>
      <div class="jor" id="jor"></div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-0" aria-selected="false" data-l="0" aria-label="Mis equipos">★<small>Mis equipos</small></button>
      <button role="tab" id="tab-1" aria-selected="true" data-l="1">Primera<small>1ª División</small></button>
      <button role="tab" id="tab-2" aria-selected="false" data-l="2">Segunda<small>2ª División</small></button>
      <button role="tab" id="tab-5" aria-selected="false" data-l="5">1ª RFEF<small>Primera Fed.</small></button>
      <button role="tab" id="tab-3" aria-selected="false" data-l="3">Copa<small>Copa del Rey</small></button>
      <button role="tab" id="tab-4" aria-selected="false" data-l="4">Champions<small>Liga Campeones</small></button>
    </div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Busca tu equipo" autocomplete="off" aria-label="Buscar equipo">
    </label>
  </div>
</header>

<main><div class="wrap">

/* ---------- Catálogo de equipos ----------
   crest: URL o data: URI del escudo oficial cuando tengas licencia; vacío = monograma. */
const T = {};
[["ala","Deportivo Alavés","ALA"],["ath","Athletic Club","ATH"],["atm","Atlético de Madrid","ATM"],["bar","FC Barcelona","BAR"],
 ["bet","Real Betis","BET"],["cel","RC Celta","CEL"],["dep","RC Deportivo","DEP"],["elc","Elche CF","ELC"],["esp","RCD Espanyol","ESP"],
 ["get","Getafe CF","GET"],["lev","Levante UD","LEV"],["mal","Málaga CF","MAL"],["osa","CA Osasuna","OSA"],["rac","Real Racing Club","RAC"],
 ["ray","Rayo Vallecano","RAY"],["rma","Real Madrid","RMA"],["rso","Real Sociedad","RSO"],["sev","Sevilla FC","SEV"],["val","Valencia CF","VAL"],["vil","Villarreal CF","VIL"],
 ["gra","Granada CF","GRA"],["vll","Real Valladolid","VLL"],["cor","Córdoba CF","COR"],["eib","SD Eibar","EIB"],["leg","CD Leganés","LEG"],["mll","RCD Mallorca","MLL"],
 ["lpa","UD Las Palmas","LPA"],["rsb","Real Sociedad B","RSB"],["gir","Girona FC","GIR"],["clb","Celta Fortuna","CLB"],["alm","UD Almería","ALM"],["ovi","Real Oviedo","OVI"],
 ["sab","CE Sabadell","SAB"],["ten","CD Tenerife","TEN"],["cad","Cádiz CF","CAD"],["ceu","AD Ceuta FC","CEU"],["alb","Albacete BP","ALB"],["eld","CD Eldense","ELD"],
 ["cas","CD Castellón","CAS"],["spo","Real Sporting","SPO"],["and","FC Andorra","AND"],["bur","Burgos CF","BUR"]
].forEach(([id,name,abbr])=>T[id]={id,name,abbr});
const CANARY=new Set(["lpa","ten","paso"]);
const COMP={1:{short:"Primera",name:"LALIGA EA SPORTS"},2:{short:"Segunda",name:"LALIGA HYPERMOTION"},5:{short:"Primera Federación",name:"PRIMERA FEDERACIÓN"},3:{short:"la Copa",name:"COPA DEL REY"},4:{short:"la Champions",name:"UEFA CHAMPIONS LEAGUE"}};
const jornLabel=j=>/^\d+$/.test(String(j))?"Jornada "+j:String(j||"");
const PREF=new Set(["cd","ud","sd","cf","fc","rcd","ad","ce","ue","rsd","sc","cda","ub","rc","club","de","del","la","el","real","atlético","atletico","sporting","deportivo","ca","sad","cp","as","ac","afc","rb","ss","sv"]);
function siglas(n){const w=String(n).split(/[\s\-\/]+/).filter(x=>x.length>2&&!PREF.has(x.toLowerCase()));return ((w[0]||String(n)).replace(/[^A-Za-zÁÉÍÓÚÑÜÇáéíóúñüç]/g,"").slice(0,3)||"?").toUpperCase()}
/* Escudos: lista de ids con imagen en assets/escudos/ (escudos/lista.json). */
let ESCUDOS=new Set();

/* ---------- Utilidades ---------- */
const TZ="Europe/Madrid";
const fDay=new Intl.DateTimeFormat("es-ES",{timeZone:TZ,weekday:"long",day:"numeric",month:"long"});
const fDayShort=new Intl.DateTimeFormat("es-ES",{timeZone:TZ,weekday:"short",day:"numeric",month:"short"});
const fTime=new Intl.DateTimeFormat("es-ES",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});
const fTimeCan=new Intl.DateTimeFormat("es-ES",{timeZone:"Atlantic/Canary",hour:"2-digit",minute:"2-digit"});
const fKey=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"});
const fStamp=new Intl.DateTimeFormat("es-ES",{timeZone:TZ,weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const hue=str=>{let h=0;for(const c of str)h=(h*31+c.charCodeAt(0))%360;return h};

function teamOf(id,name,ab){
  const t=T[id];
  if(t)return t;
  const n=name||id||"?";
  return {id:id||"",name:n,abbr:ab||siglas(n)};
}
function crest(t,big){
  const h=hue(t.name);
  const bg=`linear-gradient(160deg,hsl(${h} 45% 38%) 0 55%,hsl(${(h+40)%360} 40% 28%) 55%)`;
  return `<span class="crest${big?" lg":""}" style="background:${bg}" aria-hidden="true">${esc(t.abbr)}${t.id&&ESCUDOS.has(t.id)?`<img src="escudos/${esc(t.id)}.png" alt="">`:""}</span>`;
}
/* ---------- Clasificación ----------
   CLAS = {"1":{"tras":"Jornada 9","filas":[[id,pj,g,e,p,gf,gc,pts,(nombre)],…]}, "5":{"grupos":{"Grupo 1":{…}}}} */
let CLAS=null, verTabla=false;
const ZONAS={1:[[4,"z1","Champions"],[6,"z2","Europa"],[-3,"z3","Descenso"]],
  2:[[2,"z1","Ascenso"],[6,"z2","Play-off"],[-4,"z3","Descenso"]],
  5:[[1,"z1","Ascenso"],[5,"z2","Play-off"],[-5,"z3","Descenso"]],
  4:[[8,"z1","Octavos"],[24,"z2","Play-off"],[-12,"z3","Eliminado"]]};
function tablaDe(m){
  if(!CLAS)return null;
  let t=CLAS[m.liga];
  if(t&&t.grupos)t=t.grupos[m.etiqueta]||null;
  return t&&Array.isArray(t.filas)&&t.filas.length?t:null;
}
function zonaDe(liga,pos,n){for(const [h,c] of (ZONAS[liga]||[])){if(h>0&&pos<=h)return c;if(h<0&&pos>n+h)return c}return ""}
function tablaHTML(m){
  const t=tablaDe(m);if(!t)return "";
  const F=t.filas,n=F.length;
  const busca=(id,nom)=>F.findIndex(r=>r[0]===id||(r[8]&&nom&&norm(r[8])===norm(nom)));
  const iH=busca(m.localId,m.local),iA=busca(m.visitanteId,m.visitante);
  if(iH<0&&iA<0)return "";
  const s=new Set();
  [iH,iA].filter(i=>i>=0).forEach(i=>{for(let k=i-1;k<=i+1;k++)if(k>=0&&k<n)s.add(k)});
  let lo=Math.min(...s),hi=Math.max(...s);
  if(hi-lo<=6)for(let k=lo;k<=hi;k++)s.add(k);
  while(s.size<5&&s.size<n){if(lo>0)s.add(--lo);if(s.size<5&&hi<n-1)s.add(++hi)}
  const vecinos=[...s].sort((x,y)=>x-y);
  const ver=verTabla?F.map((_,i)=>i):vecinos;
  let prev=-1,filas="";
  for(const i of ver){
    if(prev>=0&&i>prev+1)filas+=`<tr class="gap" aria-hidden="true"><td colspan="5">···</td></tr>`;
    const r=F[i],dg=r[5]-r[6],tm=teamOf(r[0],r[8]);
    filas+=`<tr class="${zonaDe(m.liga,i+1,n)}${i===iH||i===iA?" yo":""}"><td class="ps">${i+1}</td><td class="eq">${esc(tm.name)}</td><td class="pj">${r[1]}</td><td class="dg">${dg>0?"+"+dg:dg<0?"−"+(-dg):0}</td><td class="pt">${r[7]}</td></tr>`;
    prev=i;
  }
  const z=ZONAS[m.liga]||[];
  return `<div class="tabla" id="tabla">
    <div class="tb-h"><h3 class="sec-t">Clasificación${t.grupos?"":(m.etiqueta&&m.liga===5?" · "+esc(m.etiqueta):"")}</h3>${t.tras?`<span class="tb-j">Tras ${esc(String(t.tras).toLowerCase())}</span>`:""}</div>
    <table><thead><tr><th>#</th><th class="eq">Equipo</th><th>PJ</th><th>DG</th><th>Pts</th></tr></thead><tbody>${filas}</tbody></table>
    <div class="tb-pie"><span class="ley">${z.map(([,c,txt])=>`<span><i style="background:var(--${c})"></i>${txt}</span>`).join("")}</span>${vecinos.length<n?`<button class="tb-ver" id="vertabla" type="button" aria-expanded="${verTabla}">${verTabla?"Ver menos":"Ver tabla completa"}</button>`:""}</div>
  </div>`;
}
/* Un canal puede venir como clave del catálogo ("hyper2") o como objeto {name, dial, how, op}. */
function chOf(c){
  if(typeof c==="string")return CH[c]||{name:c,short:c.slice(0,3).toUpperCase(),op:"dazn",dial:"",how:""};
  return {short:(c.name||"TV").slice(0,3).toUpperCase(),op:"dazn",dial:"",how:"",...c};
}
/* Resultados: el partido puede traer "marcador":[local,visitante], "estado":"final"|"directo"|"aplazado"|"suspendido" y "minuto". */
const tieneMarcador=m=>Array.isArray(m.marcador)&&m.marcador.length===2;
const marcadorTxt=m=>tieneMarcador(m)?m.marcador[0]+"-"+m.marcador[1]:"";
function status(m,now){
  if(m.estado==="final")return "done";
  if(m.estado==="directo")return "live";
  if(m.estado==="aplazado"||m.estado==="suspendido")return "off";
  const k=new Date(m.inicio).getTime();
  if(now<k)return null;
  return now<k+115*60e3?"live":"done";
}
function countdown(m,now){
  const d=new Date(m.inicio).getTime()-now;
  const st=status(m,now);
  if(st==="off")return m.estado==="suspendido"?"Partido suspendido":"Partido aplazado";
  if(st==="done"&&tieneMarcador(m))return "Resultado final";
  if(st==="live"&&m.minuto)return "En juego · "+m.minuto;
  if(d<=0)return st==="live"?"Se está jugando ahora":"Partido terminado";
  const days=Math.floor(d/864e5),hrs=Math.floor(d%864e5/36e5),min=Math.floor(d%36e5/6e4);
  if(days>0)return `Empieza en ${days} d ${hrs} h`;
  if(hrs>0)return `Empieza en ${hrs} h ${min} min`;
  return `Empieza en ${min} min`;
}
function chip(c){const k=chOf(c);return `<span class="chip op-${k.op}"><span class="lg">${esc(k.short)}</span>${esc(k.name)}${k.dial?` <span class="dial">${esc(k.dial)}</span>`:""}</span>`}
function ago(iso){
  const d=(Date.now()-new Date(iso).getTime())/36e5;
  if(d<1)return "hace menos de una hora";
  if(d<24)return `hace ${Math.round(d)} h`;
  return `el ${fStamp.format(new Date(iso))}`;
}

/* ---------- Estado ---------- */
let league=1, query="", matches=null, meta=null, dbState="loading";
try{const s=localStorage.getItem("dle-league");if(s!==null&&+s>=0&&+s<=5)league=+s}catch(e){}
/* ---------- Equipos favoritos (se guardan en este móvil) ---------- */
let FAV=new Set();
try{FAV=new Set(JSON.parse(localStorage.getItem("dle-favs")||"[]"))}catch(e){}
const esFav=m=>FAV.has(m.localId)||FAV.has(m.visitanteId);
function alternarFav(id,nombre){
  if(!id)return;
  const app=!!(window.AndroidApp&&window.AndroidApp.guardarFavs);
  if(FAV.has(id)){FAV.delete(id);aviso(nombre+" ya no está en Mis equipos.")}
  else{FAV.add(id);aviso("★ "+nombre+" añadido a Mis equipos."+(app?" Te avisaremos cuando se confirme el canal y 15 minutos antes de cada partido.":""));
    try{if(app&&window.AndroidApp.permisoAvisos)window.AndroidApp.permisoAvisos()}catch(e){}}
  try{localStorage.setItem("dle-favs",JSON.stringify([...FAV]))}catch(e){}
  sincronizarAvisos();
}
/* En la app de Android: pasar favoritos y catálogo de canales a los avisos en segundo plano. */
function sincronizarAvisos(){
  try{
    if(!(window.AndroidApp&&window.AndroidApp.guardarFavs))return;
    window.AndroidApp.guardarFavs(JSON.stringify([...FAV]));
    const cat={};for(const k in CH)cat[k]={name:CH[k].name,dial:CH[k].dial||"",orange:CH[k].orange||""};
    window.AndroidApp.guardarCanales(JSON.stringify(cat));
  }catch(e){}
}
sincronizarAvisos();

function renderFresh(){
  const el=document.getElementById("fresh"),t=document.getElementById("fresh-t");
  if(!meta||!meta.actualizado){el.className="fresh";t.textContent=dbState==="loading"?"Cargando la guía…":"Guía sin datos todavía.";return}
  const old=(Date.now()-new Date(meta.actualizado).getTime())>4*864e5;
  el.className="fresh"+(old||dbState==="offline"?" stale":"");
  t.textContent=(dbState==="offline"?"Sin conexión. Guía guardada, comprobada ":"Canales comprobados ")+ago(meta.actualizado)+".";
}
function render(){
  renderFresh();
  if(matches&&!hashHecho){hashHecho=true;setTimeout(abrirHash,0)}
  document.querySelectorAll(".tabs button").forEach(b=>{const on=+b.dataset.l===league;b.setAttribute("aria-selected",String(on));if(on&&b.scrollIntoView)try{b.scrollIntoView({block:"nearest",inline:"nearest"})}catch(e){}});
  const app=document.getElementById("app");
  if(matches===null){
    return;
  }
  const now=Date.now();
  const all=league===0?matches.filter(esFav):matches.filter(m=>m.liga===league);
  const jors=[...new Set(all.filter(m=>!status(m,now)||status(m,now)==="live").map(m=>m.jornada))].filter(j=>j&&j!=="Partido aplazado");
  document.getElementById("jor").textContent=league===0?(FAV.size?FAV.size+(FAV.size===1?" equipo":" equipos"):""):jors.length?jornLabel(jors[0]):"";
  const q=norm(query.trim());
  const list=all.filter(m=>!q||norm(m.local+" "+m.visitante).includes(q)).sort((a,b)=>new Date(a.inicio)-new Date(b.inicio));
  if(!list.length){
    app.innerHTML=(league===0&&!FAV.size
      ?`<div class="empty"><b>Aún no sigues a ningún equipo</b><span>Abre cualquier partido y toca <b>☆ Seguir</b> junto al equipo. Aquí verás todos sus partidos, de cualquier competición.</span></div>`
      :league===0&&!q?`<div class="empty"><b>Tus equipos no tienen partidos cargados</b><span>Aparecerán aquí en cuanto se publiquen sus horarios.</span></div>`
      :q
      ?`<div class="empty"><b>Sin partidos de “${esc(query)}”</b><span>No juega en ${league===0?"tus equipos":COMP[league].short} en los días cargados.</span></div>`
      :`<div class="empty"><b>Aún no hay partidos cargados</b><span>La guía se rellena sola cuando LALIGA publica los horarios.</span></div>`)+foot();
    return;
  }
  const groups={};
  list.forEach(m=>{const k=fKey.format(new Date(m.inicio));(groups[k]=groups[k]||[]).push(m)});
  // El "presente": el primer partido que no ha terminado (en juego o por jugar).
  let ia=list.findIndex(m=>{const s=status(m,now);return s!=="done"&&!(s==="off"&&new Date(m.inicio).getTime()<now)});
  if(ia<0)ia=list.length-1;
  const ahoraId=list[ia]&&list[ia]._id, hoyKey=fKey.format(new Date(now));
  app.innerHTML=Object.values(groups).map(g=>{const pas=g.every(m=>status(m,now)==="done");return `
    <section class="day${pas?" pasado":""}"><h2>${cap(fDay.format(new Date(g[0].inicio)))}${fKey.format(new Date(g[0].inicio))===hoyKey?' · <em class="hoyd">Hoy</em>':""}</h2><div class="list">
    ${g.map(m=>{const st=status(m,now),h=teamOf(m.localId,m.local,m.localAbbr),a=teamOf(m.visitanteId,m.visitante,m.visitanteAbbr),ch=m.canales||[];return `
      <button class="match${st==="done"?" past":""}${m._id===ahoraId&&!q?" ahora":""}"${m._id===ahoraId?' id="ahora"':""} data-id="${esc(m._id)}" aria-label="${esc(h.name)} contra ${esc(a.name)}, ver hora y canal">
        <span class="kick"><b class="${tieneMarcador(m)&&(st==="live"||st==="done")?"sc":""}">${tieneMarcador(m)&&(st==="live"||st==="done")?marcadorTxt(m):m.horaPendiente?"--:--":fTime.format(new Date(m.inicio))}</b><span class="${st||""}">${st==="live"?(m.minuto?esc(m.minuto):"En juego"):st==="done"?"Final":st==="off"?(m.estado==="suspendido"?"Suspend.":"Aplazado"):m.etiqueta?esc(m.etiqueta):"h"}</span></span>
        <span class="teams">
          ${league===0?`<span class="compl">${esc((COMP[m.liga]||{}).name||"")}</span>`:""}
          <span class="team">${crest(h)}<span class="nm">${FAV.has(m.localId)?'<i class="star" aria-label="favorito">★</i>':""}${esc(h.name)}</span></span>
          <span class="team">${crest(a)}<span class="nm">${FAV.has(m.visitanteId)?'<i class="star" aria-label="favorito">★</i>':""}${esc(a.name)}</span></span>
          <span class="chips">${ch.length?ch.slice(0,esEscritorio()?4:2).map(chip).join(""):m.sinTV?`<span class="chip pend">Sin TV</span>`:`<span class="chip pend">Canal por confirmar</span>`}${ch.length>(esEscritorio()?4:2)?`<span class="chip op-dazn" style="padding-left:8px">+${ch.length-(esEscritorio()?4:2)}</span>`:""}${m.provisional&&ch.length?`<span class="chip pend">Provisional</span>`:""}</span>
        </span>
      </button>`}).join("")}
    </div></section>`}).join("")+foot();
  if(irPendiente&&!q){irPendiente=false;tocado=false;requestAnimationFrame(()=>irAhora(false))}
  requestAnimationFrame(botonHoy);
  medirCabecera();

    panelIniciado=true;
    const a=document.getElementById("ahora");
    if(!actual){if(a)open(a.dataset.id);else panelVacio()}
  }
}

function altoCabecera(){const h=document.querySelector("header.top");return h?h.getBoundingClientRect().bottom:0}
function objetivoAhora(){
  const el=document.getElementById("ahora");if(!el)return null;

}
function irAhora(suave){
  const t=objetivoAhora();if(!t)return;
  const y=t.getBoundingClientRect().top+window.scrollY-altoCabecera()-6;
  try{window.scrollTo({top:Math.max(0,y),behavior:suave&&!matchMedia("(prefers-reduced-motion: reduce)").matches?"smooth":"auto"})}catch(e){window.scrollTo(0,Math.max(0,y))}
}
function botonHoy(){
  const b=document.getElementById("hoy"),el=document.getElementById("ahora");if(!b)return;
  if(!el||query.trim()){b.hidden=true;return}
  const r=el.getBoundingClientRect(),top=altoCabecera();

function foot(){return `<p class="foot">Horarios oficiales de LALIGA, RFEF y UEFA; canal exacto según la guía de Movistar Plus+, DAZN, RTVE y las teles autonómicas. Hora peninsular. Pueden cambiar a última hora: si es un partido importante, mira la ficha el mismo día.</p>`}

function aviso(t){let el=document.getElementById("aviso");if(!el){el=document.createElement("div");el.id="aviso";el.className="aviso";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),2600)}
function textoPartido(m){
  const d=new Date(m.inicio),h=teamOf(m.localId,m.local,m.localAbbr),a=teamOf(m.visitanteId,m.visitante,m.visitanteAbbr),ch=(m.canales||[]).map(chOf);

  return `⚽ ${h.name} – ${a.name}\n${(COMP[m.liga]||{}).name||""}\n🗓 ${cap(fDay.format(d))}${m.horaPendiente?" · hora por fijar":" · "+fTime.format(d)+" h"}\n${tv}\n${enlace(m)}`;
}
async function compartir(m){

/* ---------- Marcadores (football-data.org, plan gratuito: con algunos minutos de retraso) ----------
   config.js define window.MARCADORES = {clave, competiciones:{1:"PD",4:"CL"}}. Sin eso no se consulta nada. */
const VIVO={};               // _id -> {marcador, estado, minuto}
let vivoTimer=null, vivoUltimo=0, vivoFuente=false;
const FD_ESTADO={IN_PLAY:"directo",PAUSED:"directo",FINISHED:"final",AWARDED:"final",POSTPONED:"aplazado",SUSPENDED:"suspendido",CANCELLED:"aplazado"};
const QUITAR=new Set(["fc","cf","cd","ud","sd","rcd","ad","ce","club","de","del","la","el","real","sad","ac","as","afc","sc","sv","vfb","fk","ssc","rc","bv","sport","balompie","futbol","calcio","1."]);
function toks(n){return String(n||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(w=>w.length>2&&!QUITAR.has(w))}
function parecido(nuestro,fd){
  const a=toks(nuestro.name), b=new Set([...toks(fd.name),...toks(fd.shortName)]);
  if(fd.tla&&nuestro.abbr&&fd.tla.toUpperCase()===nuestro.abbr.toUpperCase())return true;
  return a.some(w=>b.has(w)||[...b].some(x=>x.startsWith(w)||w.startsWith(x)));
}
function enVentana(m,now){const k=new Date(m.inicio).getTime();return now>k-15*60e3&&now<k+3*36e5}
function necesitaMarcador(now){
  const cfg=window.MARCADORES;if(!cfg||!cfg.clave||!matches)return false;
  return matches.some(m=>cfg.competiciones[m.liga]&&m.estado!=="final"&&now>new Date(m.inicio).getTime()-15*60e3&&now<new Date(m.inicio).getTime()+20*36e5);
}
async function pedirJSON(url,clave){
  try{
    const r=await fetch(url,{headers:{"X-Auth-Token":clave},cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    return await r.json();
  }catch(e){
    // En la app, si el navegador interno no deja la consulta, la hace Android.
    if(window.AndroidApp&&window.AndroidApp.pedir)return await new Promise((ok,ko)=>{
      const id="r"+Date.now()+Math.random().toString(36).slice(2);
      window.__resp=window.__resp||{};
      window.__resp[id]=(st,body)=>{delete window.__resp[id];if(st>=200&&st<300){try{ok(JSON.parse(body))}catch(x){ko(x)}}else ko(new Error("HTTP "+st))};
      window.AndroidApp.pedir(id,url,"X-Auth-Token",clave);
      setTimeout(()=>{if(window.__resp[id]){delete window.__resp[id];ko(new Error("timeout"))}},15000);
    });
    throw e;
  }
}
async function actualizarMarcadores(){
  const cfg=window.MARCADORES,now=Date.now();
  if(!necesitaMarcador(now))return;
  if(now-vivoUltimo<55e3)return;
  vivoUltimo=now;
  const dia=t=>new Date(t).toISOString().slice(0,10);
  const codes=[...new Set(Object.values(cfg.competiciones))].join(",");
  const url=`https://api.football-data.org/v4/matches?competitions=${codes}&dateFrom=${dia(now-864e5)}&dateTo=${dia(now+864e5)}`;
  let d;try{d=await pedirJSON(url,cfg.clave)}catch(e){return}
  vivoFuente=true;
  const porLiga={};for(const k in cfg.competiciones)porLiga[cfg.competiciones[k]]=+k;
  for(const x of d.matches||[]){
    const liga=porLiga[x.competition&&x.competition.code];if(!liga)continue;
    const t=new Date(x.utcDate).getTime();
    const m=matches.find(m=>m.liga===liga&&Math.abs(new Date(m.inicio).getTime()-t)<3*36e5
      &&parecido(teamOf(m.localId,m.local,m.localAbbr),x.homeTeam||{})&&parecido(teamOf(m.visitanteId,m.visitante,m.visitanteAbbr),x.awayTeam||{}));
    if(!m)continue;
    const est=FD_ESTADO[x.status];if(!est)continue;
    const sc=x.score&&x.score.fullTime||{};
    const v={estado:est};
    if(sc.home!=null&&sc.away!=null)v.marcador=[sc.home,sc.away];
    if(x.status==="PAUSED")v.minuto="Descanso";else if(x.minute)v.minuto=x.minute+"'";
    VIVO[m._id]=v;
  }
  aplicarVivo();render();
}
function aplicarVivo(){
  if(!matches)return;
  for(const m of matches){const v=VIVO[m._id];if(!v||m.estado==="final"&&!v.marcador)continue;Object.assign(m,v)}
}
function programarMarcadores(){
  clearInterval(vivoTimer);
  if(!window.MARCADORES)return;
  actualizarMarcadores();
  vivoTimer=setInterval(actualizarMarcadores,60e3);
}

        </div>`}).join(""):m.sinTV?`<p class="note warn">Este partido no se emite por televisión.</p>`:`<p class="note warn">El canal de este partido aún no se ha publicado. La guía lo añadirá en su próxima comprobación.</p>`}
    </div>
    ${m.provisional?`<p class="note warn">Canal provisional: la señal exacta (M+ LALIGA 2, Liga de Campeones 3…) suele confirmarse unos días antes del partido.</p>`:""}
    ${m.nota?`<p class="note">${esc(m.nota)}</p>`:""}
    ${VIVO[m._id]&&m.estado==="directo"?`<p class="note">Marcador de football-data.org, con unos minutos de retraso.</p>`:""}
    ${tablaHTML(m)}
    <div class="acciones">
      <button class="btn" id="compartir" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v13"/><path d="m7 8 5-5 5 5"/></svg>Compartir partido</button>
      ${conComentariosFuera()?`<a class="btn sec" href="${esc(enlace(m))}" target="_blank" rel="noopener">Comentarios</a>`:""}
    </div>
    ${conComentariosAqui()?`<div><h3 class="sec-t">Comentarios</h3><div id="comentarios"></div></div>`:""}
  </div>`;
  actual=m;
  if(conComentariosAqui())cargarComentarios(m);
  marcar("p-"+m._id);
  marcarSel(m._id);
  sheet.scrollTop=0;
  if(esEscritorio()){scrim.hidden=true;sheet.hidden=false;sheet.classList.add("on");return}
  lastFocus=document.activeElement;
  scrim.hidden=false;sheet.hidden=false;
  requestAnimationFrame(()=>{scrim.classList.add("on");sheet.classList.add("on")});
  document.getElementById("close").focus();
}
/* ---------- Escritorio ---------- */
const ESC=matchMedia("(min-width:1024px)");
const esEscritorio=()=>ESC.matches;
let panelIniciado=false;
function marcarSel(id){
  document.querySelectorAll("#app .match.sel").forEach(x=>x.classList.remove("sel"));
  if(!id)return;

}
function panelVacio(){

  scrim.hidden=true;sheet.hidden=false;sheet.classList.add("on");
}
function medirCabecera(){try{document.documentElement.style.setProperty("--cab",Math.round(altoCabecera())+"px")}catch(e){}}
addEventListener("resize",medirCabecera);
ESC.addEventListener&&ESC.addEventListener("change",()=>{

  if(esEscritorio()){scrim.classList.remove("on");scrim.hidden=true;if(actual)open(actual._id);else{panelIniciado=false;render()}}

});
document.addEventListener("keydown",e=>{
  if(!esEscritorio()||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.target&&e.target.closest&&e.target.closest("input,textarea,select"))return;

/* ---------- Datos ----------
   1) Última guía guardada en el móvil, para abrir al instante y sin conexión.
   2) Si no hay, la copia que viene dentro de la app (partidos.json).
   3) Después, la guía actualizada del repositorio de GitHub (config.js → DATOS_URL). */
function aplicar(d,origen){
  if(!d||!Array.isArray(d.partidos))return false;
  matches=d.partidos.map(p=>({_id:p.id,...p})).filter(m=>m.inicio);
  meta={actualizado:d.actualizado};
  CLAS=d.clasificacion||null;
  if(origen)dbState=origen;
  aplicarVivo();render();
  if(!vivoTimer)programarMarcadores();
  return true;
}
function guardada(){try{return JSON.parse(localStorage.getItem("dle-guia")||"null")}catch(e){return null}}
async function actualizar(){
  const url=window.DATOS_URL;
  if(!url){if(dbState==="loading"){dbState="ok";render()}return}
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),10000);
  try{
    const r=await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store",signal:ctl.signal});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    const g=guardada();
    if(!g||new Date(d.actualizado)>=new Date(g.actualizado||0)){
      try{localStorage.setItem("dle-guia",JSON.stringify(d))}catch(e){}
      aplicar(d,"ok");
    }else{dbState="ok";renderFresh()}
  }catch(e){dbState="offline";renderFresh()}
  finally{clearTimeout(t)}
}
let ultima=0;
window.alVolver=()=>{if(Date.now()-ultima>10*60e3){ultima=Date.now();actualizar()}else render()};
window.abrirPartido=id=>{if(!matches)return;const m=matches.find(x=>x._id===id);if(m){league=m.liga;render();open(id)}};
window.atras=()=>{if(esEscritorio()){if(actual){close();return true}return false}if(!sheet.hidden){close();return true}return false};

(async()=>{
  try{const r=await fetch("escudos/lista.json");if(r.ok)ESCUDOS=new Set(await r.json())}catch(e){}
  if(!aplicar(guardada())){
    try{const r=await fetch("partidos.json");if(r.ok)aplicar(await r.json())}catch(e){}
  }
  ultima=Date.now();
  actualizar();
})();
setInterval(render,60e3);
