<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>Dónde lo Echan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: listing guide de jornada — cabecera tipo marcador, partidos agrupados por día, ficha inferior al tocar */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --ink:#14201A; --muted:#5E6B63; --line:#DCE2DA;
  --accent:#D9480F; --pitch:#1F5E3B; --pitch-ink:#F2F4EF;
  --live:#C92A2A; --done:#8A958E; --warn:#9A6700; --warn-bg:#FBF1D9;
  --op-m:#1C4E80; --op-m-bg:#E3ECF5; --op-dazn:#262626; --op-dazn-bg:#ECECEA;
  --op-free:#2B7A3D; --op-free-bg:#E2F0E4; --op-orange:#A14A00; --op-orange-bg:#F7E9DC;
  --shadow:0 18px 40px rgba(20,32,26,.18);
  --fav:#C98A0B; --fav-bg:#FFF7E0; --fav-line:#EBCB7A; --fav-ink:#8A5A00; --es-ink:#B4232A; --es-bg:#FFF3F1; --es-line:#F0C4BF;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1511; --surface:#16211B; --ink:#E9EFE9; --muted:#9AA79F; --line:#26332B;
  --accent:#FF7A3D; --pitch:#123A25; --pitch-ink:#E9EFE9;
  --live:#FF6B6B; --done:#6E7B73; --warn:#F2C25B; --warn-bg:#3A2E10;
  --op-m:#9CC3EC; --op-m-bg:#1A2A3A; --op-dazn:#E8E8E4; --op-dazn-bg:#2A2D2B;
  --op-free:#8DD69C; --op-free-bg:#183222; --op-orange:#FFB577; --op-orange-bg:#3A2614;
  --shadow:0 18px 40px rgba(0,0,0,.5); color-scheme:dark;
  --fav:#E0A93A; --fav-bg:#2B2410; --fav-line:#5A4718; --fav-ink:#F2C766; --es-ink:#FF8F86; --es-bg:#2D1A19; --es-line:#5A2C29}}
:root[data-theme="dark"]{
  --bg:#0D1511; --surface:#16211B; --ink:#E9EFE9; --muted:#9AA79F; --line:#26332B;
  --accent:#FF7A3D; --pitch:#123A25; --pitch-ink:#E9EFE9;
  --live:#FF6B6B; --done:#6E7B73; --warn:#F2C25B; --warn-bg:#3A2E10;
  --op-m:#9CC3EC; --op-m-bg:#1A2A3A; --op-dazn:#E8E8E4; --op-dazn-bg:#2A2D2B;
  --op-free:#8DD69C; --op-free-bg:#183222; --op-orange:#FFB577; --op-orange-bg:#3A2614;
  --shadow:0 18px 40px rgba(0,0,0,.5); color-scheme:dark;
  --fav:#E0A93A; --fav-bg:#2B2410; --fav-line:#5A4718; --fav-ink:#F2C766; --es-ink:#FF8F86; --es-bg:#2D1A19; --es-line:#5A2C29}

*{box-sizing:border-box}
html,body{margin:0}
body{-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pitch)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{background:var(--pitch);color:var(--pitch-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .wrap{padding-block:14px 12px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.brand h1 span{color:var(--accent)}
.brand .jor{white-space:nowrap;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;text-align:right}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:rgba(255,255,255,.08);border-radius:10px;padding:3px;gap:3px}
.tabs button{appearance:none;border:0;background:transparent;color:inherit;font-family:var(--f-display);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0;padding:7px 9px;white-space:nowrap;flex:1 0 auto;border-radius:8px;cursor:pointer;line-height:1.1}
.tabs::-webkit-scrollbar{display:none}
.tabs button.vivo{box-shadow:inset 0 0 0 1.5px #FF6B6B}
.tabs button .envivo{display:flex;width:max-content;align-items:center;gap:4px;margin:2px auto 0;padding:1px 6px 1px 5px;border-radius:999px;background:#D92D2D;color:#fff;font-family:var(--f-body);font-weight:700;font-size:9.5px;line-height:1.35;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.tabs button .envivo i{width:6px;height:6px;border-radius:50%;background:#fff;animation:latido 1.4s ease-in-out infinite}
@keyframes latido{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.tabs button .envivo i{animation:none}}
.tabs.mas{-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
.tabs button small{display:block;font-family:var(--f-body);font-weight:500;font-size:9.5px;white-space:nowrap;text-transform:none;letter-spacing:0;opacity:.75}
.tabs button[aria-selected="true"]{background:var(--pitch-ink);color:var(--pitch)}
.tabs button:focus-visible,.match:focus-visible,.close:focus-visible,.search input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{position:relative}
.search input{width:100%;border:0;border-radius:10px;padding:10px 12px 10px 36px;font:inherit;font-size:15px;background:rgba(255,255,255,.12);color:var(--pitch-ink)}
.search input::placeholder{color:var(--pitch-ink);opacity:.6}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.7}

.fresh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding-top:12px}
.fresh .dot{width:8px;height:8px;border-radius:50%;background:var(--op-free);flex:none}
.fresh.stale .dot{background:var(--warn)}

main .wrap{padding-block:0 40px;display:flex;flex-direction:column;gap:20px}
.day h2{margin:12px 0 8px;font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:flex;align-items:center;gap:10px}
.day h2::after{content:"";flex:1;height:1px;background:var(--line)}
.list{display:flex;flex-direction:column;gap:8px}

.match{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font:inherit;color:inherit;transition:transform .12s ease,border-color .12s}
.match:hover{border-color:var(--muted)}
.match:active{transform:scale(.99)}
.match.past{opacity:.72}
.team .star{font-style:normal;color:var(--accent);margin-right:4px}
.compl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fav{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;min-height:34px}
.fav[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.fav:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.day.pasado h2{opacity:.65}
.day h2 .hoyd{font-style:normal;color:var(--accent);letter-spacing:.06em}
.match.ahora{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
/* Partidos con un equipo favorito (dorado) o, en Champions y Conference, con un equipo español (rojo y gualda) */
.match.m-fav,.match.m-es{position:relative;overflow:hidden;padding-left:17px}
.match.m-fav{background:var(--fav-bg);border-color:var(--fav-line)}
.match.m-es{background:var(--es-bg);border-color:var(--es-line)}
.match.m-fav::before,.match.m-es::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--fav)}
.match.m-es::before{background:linear-gradient(#C60B1E 0 25%,#FFC400 25% 75%,#C60B1E 75%)}
.match.m-fav.ahora,.match.m-es.ahora{border-color:var(--accent)}
.team .nm.t-fav,.vs .side b.t-fav{color:var(--fav-ink)}
.team .nm.t-es,.vs .side b.t-es{color:var(--es-ink)}
.team .nm.t-fav,.team .nm.t-es{font-weight:800}
.hoy{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:15;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:10px 18px;background:var(--pitch);color:var(--pitch-ink);font:inherit;font-weight:700;font-size:14px;box-shadow:var(--shadow);cursor:pointer}
[hidden]{display:none!important}
.hoy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kick{display:flex;flex-direction:column;align-items:center;gap:2px;border-right:1px dashed var(--line);padding-right:10px;text-align:center}
.kick b{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.kick span{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kick span.live{color:var(--live)} .kick span.done{color:var(--done)} .kick span.off{color:var(--warn)}
.kick b.sc{font-size:22px;letter-spacing:0;white-space:nowrap}
.vs .mid.score{font-size:40px;color:var(--ink);line-height:1;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.vs .mid.score i{font-style:normal;color:var(--muted);font-size:26px}
.vs .mid.score.live{color:var(--live)}
.teams{display:flex;flex-direction:column;gap:6px;min-width:0}
.team{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.team .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}

.crest{flex:none;width:26px;height:26px;border-radius:50% 50% 46% 46%/42% 42% 58% 58%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:9px;letter-spacing:0;color:#fff;position:relative;overflow:hidden}
.crest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--surface)}
.crest.lg{width:64px;height:64px;font-size:20px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px 3px 4px;border-radius:999px;line-height:1.2;white-space:nowrap}
.chip .lg{display:inline-grid;place-items:center;min-width:20px;height:16px;padding:0 4px;border-radius:4px;font-family:var(--f-display);font-weight:800;font-size:10px;letter-spacing:.02em}
.chip .dial{font-family:var(--f-mono);font-weight:500;opacity:.8}
.chip.pend{background:var(--warn-bg);color:var(--warn);padding-left:8px}
.op-m{background:var(--op-m-bg);color:var(--op-m)} .op-m .lg{background:var(--op-m);color:var(--op-m-bg)}
.op-dazn{background:var(--op-dazn-bg);color:var(--op-dazn)} .op-dazn .lg{background:var(--op-dazn);color:var(--op-dazn-bg)}
.op-free{background:var(--op-free-bg);color:var(--op-free)} .op-free .lg{background:var(--op-free);color:var(--op-free-bg)}
.op-orange{background:var(--op-orange-bg);color:var(--op-orange)} .op-orange .lg{background:var(--op-orange);color:var(--op-orange-bg)}

.empty{padding:40px 8px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink);font-size:16px}
.skel{height:92px;border-radius:12px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--line),transparent);animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.foot a{color:var(--accent);font-weight:600}

/* Clasificación en la ficha */
.tabla{--z1:#2F8A57;--z2:#8DBF9F;--z3:var(--live)}
.tb-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tb-h .sec-t{margin-bottom:6px}
.tb-j{font-size:11.5px;color:var(--muted)}
.tabla table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tabla th{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;padding:0 6px 6px;border-bottom:1px solid var(--line)}
.tabla th.eq{text-align:left}
.tabla td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);color:var(--muted)}
.tabla tr:last-child td{border-bottom:0}
.tabla td.ps{width:26px;text-align:center;font-family:var(--f-mono);font-size:12px;box-shadow:inset 3px 0 0 var(--z,transparent)}
.tabla td.eq{text-align:left;color:var(--ink);max-width:0;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabla td.pt{font-weight:700;color:var(--ink);width:34px}
.tabla td.dg,.tabla td.pj{width:30px}
.tabla tr.z1{--z:var(--z1)} .tabla tr.z2{--z:var(--z2)} .tabla tr.z3{--z:var(--z3)}
.tabla tr.yo td{background:color-mix(in srgb,var(--accent) 9%,transparent);color:var(--ink)}
.tabla tr.yo td.eq{font-weight:700}
.tabla tr.yo td.ps{color:var(--accent);font-weight:700}
.tabla tr.gap td{padding:2px 6px;text-align:center;color:var(--muted);opacity:.6;letter-spacing:.3em;font-size:11px}
.tb-pie{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.ley{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.ley i{display:inline-block;width:3px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tb-ver{appearance:none;border:0;background:none;color:var(--accent);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 0}
.tb-ver:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* Filtro por equipo en Mis equipos */
.favbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:-2px 0 0}
.favbar::-webkit-scrollbar{display:none}
.favbar button{appearance:none;flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--pitch-ink);border-radius:999px;padding:4px 12px 4px 4px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:34px}
.favbar button.todos{padding-left:12px}
.favbar button .crest{width:24px;height:24px;font-size:8.5px}
.favbar button[aria-pressed="true"]{background:var(--pitch-ink);color:var(--pitch);border-color:var(--pitch-ink)}
.favbar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eq-l button.ir{appearance:none;border:0;background:none;padding:0;color:var(--ink);font:inherit;font-weight:600;font-size:14.5px;text-align:left;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.eq-l button.ir:hover{color:var(--accent)}
@media (min-width:1024px){header.top .wrap .favbar{grid-row:2;grid-column:1/-1;margin-top:-4px}}

/* Asistente con IA */
.ia-fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:16;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 16px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:14.5px;box-shadow:var(--shadow);cursor:pointer}
.ia-fab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ia{position:fixed;top:0;bottom:0;right:0;z-index:32;width:min(440px,100vw);background:var(--surface);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ia.on{transform:none}
.ia-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ia-cab b{display:block;font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;line-height:1.1}
.ia-cab small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.ia-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.ia-m{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.45;word-wrap:break-word}
.ia-m.yo{align-self:flex-end;background:var(--pitch);color:var(--pitch-ink);border-bottom-right-radius:4px}
.ia-m.el{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.ia-m.el p{margin:0 0 6px} .ia-m.el p:last-child{margin:0}
.ia-m.el ul{margin:4px 0;padding-left:18px}
.ia-m.err{background:var(--warn-bg);color:var(--warn)}
.ia-ref{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:1px 9px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;margin:0 2px;white-space:nowrap}
.ia-pen{display:inline-flex;gap:4px} .ia-pen i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:iapen 1s infinite} .ia-pen i:nth-child(2){animation-delay:.15s} .ia-pen i:nth-child(3){animation-delay:.3s}
@keyframes iapen{50%{opacity:.25}}
.ia-sug{display:flex;flex-wrap:wrap;gap:6px}
.ia-sug small{flex-basis:100%;font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.ia-sug button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;text-align:left}
.ia-form{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.ia-form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;background:var(--bg);color:var(--ink)}
.ia-form input:focus{outline:2px solid var(--pitch);outline-offset:0}
.ia-form .btn{flex:none;min-height:42px;width:48px;padding:0;font-size:18px}
@media (min-width:1024px){.ia-fab{right:auto;left:calc((100vw - var(--cont))/2 + 24px)}}
@media (prefers-reduced-motion:reduce){.ia{transition:none}.ia-pen i{animation:none}}

/* Menú lateral */
.brand-l{display:flex;align-items:center;gap:10px;min-width:0}
.burger{appearance:none;border:0;background:rgba(255,255,255,.12);color:var(--pitch-ink);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.burger:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.menu-scrim{position:fixed;inset:0;background:rgba(10,16,12,.5);z-index:30;opacity:0;transition:opacity .2s}
.menu-scrim.on{opacity:1}
.menu{position:fixed;top:0;bottom:0;left:0;z-index:31;width:min(340px,88vw);background:var(--surface);box-shadow:var(--shadow);transform:translateX(-102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.menu.on{transform:none}
.menu-cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.menu-cab b{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.menu-cab b span{color:var(--accent)}
.menu h3{margin:0 0 6px;font-family:var(--f-display);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.opc{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.opc:last-child{border-bottom:0}
.opc span{display:flex;flex-direction:column;gap:2px;min-width:0}
.opc span b{font-weight:600;font-size:15px}
.opc span small{font-size:12.5px;color:var(--muted);line-height:1.35}
.sw{appearance:none;flex:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;margin-top:2px}

/* ---------- Clasificación ----------
   CLAS = {"1":{"tras":"Jornada 9","filas":[[id,pj,g,e,p,gf,gc,pts,(nombre)],…]}, "5":{"grupos":{"Grupo 1":{…}}}} */
let CLAS=null, verTabla=false;
const ZONAS={1:[[4,"z1","Champions"],[6,"z2","Europa"],[-3,"z3","Descenso"]],
  2:[[2,"z1","Ascenso"],[6,"z2","Play-off"],[-4,"z3","Descenso"]],
  5:[[1,"z1","Ascenso"],[5,"z2","Play-off"],[-5,"z3","Descenso"]],
  4:[[8,"z1","Octavos"],[24,"z2","Play-off"],[-12,"z3","Eliminado"]],
  6:[[8,"z1","Octavos"],[24,"z2","Play-off"],[-12,"z3","Eliminado"]]};
function tablaDe(m){
  if(!CLAS)return null;
  let t=CLAS[m.liga];
  if(t&&t.grupos)t=t.grupos[m.etiqueta]||null;
  return t&&Array.isArray(t.filas)&&t.filas.length?t:null;
}
function zonaDe(liga,pos,n){for(const [h,c] of (ZONAS[liga]||[])){if(h>0&&pos<=h)return c;if(h<0&&pos>n+h)return c}return ""}
function tablaHTML(m){
  const t=tablaDe(m);if(!t)return "";
  const F=t.filas,n=F.length;
  const busca=(id,nom)=>F.findIndex(r=>r[0]===id||(r[8]&&nom&&norm(r[8])===norm(nom)));
  const iH=busca(m.localId,m.local),iA=busca(m.visitanteId,m.visitante);
  if(iH<0&&iA<0)return "";
  const s=new Set();
  [iH,iA].filter(i=>i>=0).forEach(i=>{for(let k=i-1;k<=i+1;k++)if(k>=0&&k<n)s.add(k)});
  let lo=Math.min(...s),hi=Math.max(...s);
  if(hi-lo<=6)for(let k=lo;k<=hi;k++)s.add(k);
  while(s.size<5&&s.size<n){if(lo>0)s.add(--lo);if(s.size<5&&hi<n-1)s.add(++hi)}
  const vecinos=[...s].sort((x,y)=>x-y);
  const ver=verTabla?F.map((_,i)=>i):vecinos;
  let prev=-1,filas="";
  for(const i of ver){
    if(prev>=0&&i>prev+1)filas+=`<tr class="gap" aria-hidden="true"><td colspan="5">···</td></tr>`;
    const r=F[i],dg=r[5]-r[6],tm=teamOf(r[0],r[8]);
    filas+=`<tr class="${zonaDe(m.liga,i+1,n)}${i===iH||i===iA?" yo":""}"><td class="ps">${i+1}</td><td class="eq">${esc(tm.name)}</td><td class="pj">${r[1]}</td><td class="dg">${dg>0?"+"+dg:dg<0?"−"+(-dg):0}</td><td class="pt">${r[7]}</td></tr>`;
    prev=i;
  }
  const z=ZONAS[m.liga]||[];
  return `<div class="tabla" id="tabla">
    <div class="tb-h"><h3 class="sec-t">Clasificación${t.grupos?"":(m.etiqueta&&m.liga===5?" · "+esc(m.etiqueta):"")}</h3>${t.tras?`<span class="tb-j">Tras ${esc(String(t.tras).toLowerCase())}</span>`:""}</div>
    <table><thead><tr><th>#</th><th class="eq">Equipo</th><th>PJ</th><th>DG</th><th>Pts</th></tr></thead><tbody>${filas}</tbody></table>
    <div class="tb-pie"><span class="ley">${z.map(([,c,txt])=>`<span><i style="background:var(--${c})"></i>${txt}</span>`).join("")}</span>${vecinos.length<n?`<button class="tb-ver" id="vertabla" type="button" aria-expanded="${verTabla}">${verTabla?"Ver menos":"Ver tabla completa"}</button>`:""}</div>
  </div>`;
}
/* Un canal puede venir como clave del catálogo ("hyper2") o como objeto {name, dial, how, op}. */
function chOf(c){
  if(typeof c==="string")return CH[c]||{name:c,short:c.slice(0,3).toUpperCase(),op:"dazn",dial:"",how:""};
  return {short:(c.name||"TV").slice(0,3).toUpperCase(),op:"dazn",dial:"",how:"",...c};
}
/* Resultados: el partido puede traer "marcador":[local,visitante], "estado":"final"|"directo"|"aplazado"|"suspendido" y "minuto". */
const tieneMarcador=m=>Array.isArray(m.marcador)&&m.marcador.length===2;
const marcadorTxt=m=>tieneMarcador(m)?m.marcador[0]+"-"+m.marcador[1]:"";
function status(m,now){
  if(m.estado==="final")return "done";
  if(m.estado==="directo")return "live";
  if(m.estado==="aplazado"||m.estado==="suspendido")return "off";
  const k=new Date(m.inicio).getTime();
  if(now<k)return null;
  return now<k+115*60e3?"live":"done";
}
/* Minuto y parte del partido en juego. Si la fuente no da el minuto (football-data gratis no lo da),
   se calcula por la hora de inicio: 45 min + ~18 de descanso y descuento. Devuelve {c: corto, l: largo}. */
function tiempo(m,now){
  if(status(m,now)!=="live")return null;
  if(m.minuto==="Descanso")return {c:"Descanso",l:"Descanso"};
  if(m.minuto==="Penaltis")return {c:"Penaltis",l:"Tanda de penaltis"};
  if(m.minuto&&m.parte){
    const txt=String(m.minuto).replace(/'\+/,"+");
    if(m.parte>=3)return {c:`${txt} · Pró.`,l:`Prórroga · minuto ${txt.replace(/'$/,"")}`};
    return {c:`${txt} · ${m.parte}ª`,l:`${m.parte===1?"Primera":"Segunda"} parte · minuto ${txt.replace(/'$/,"")}`};
  }
  const e=Math.floor((now-new Date(m.inicio).getTime())/60e3);
  let n=null,aprox=false;
  const mm=String(m.minuto||"").match(/^(\d+)/);if(mm)n=+mm[1];
  if(n==null){
    if(e<0)return {c:"En juego",l:"Se está jugando ahora"};
    aprox=true;
    if(e<45)n=e+1;
    else if(e<48||(m.enJuego&&e<55))return {c:"45+' · 1ª",l:"Primera parte · descuento (aprox.)"};
    else if(e<63&&!m.enJuego)return {c:"Descanso",l:"Descanso (aprox.)"};
    else n=Math.max(46,46+(e-63));
  }
  const parte=n>45?2:1,mins=n>90?"90+":String(n);
  return {c:`${mins}' · ${parte}ª`,l:`${parte===1?"Primera":"Segunda"} parte · minuto ${mins}${aprox?" (aprox.)":""}`};
}
/* Barra de tiempo: 0–90 min (120 con prórroga); el descanso está en la mitad. */
function progreso(m,now){
  const st=status(m,now);
  if(st==="done")return {pct:100,fin:true};
  if(st!=="live")return null;
  const t=tiempo(m,now);if(!t)return null;
  if(/^Descanso/.test(t.c))return {pct:50,desc:true};
  if(/^Penaltis/.test(t.c))return {pct:100};
  const n=parseInt(t.c,10);if(isNaN(n))return null;
  const escala=(m.parte||0)>=3?120:90;
  return {pct:Math.max(1,Math.min(100,100*n/escala)),escala};
}
const nomJug=s=>String(s||"").trim();
function eventosHTML(m,now){
  const ev=(m.eventos&&m.eventos.length?m.eventos:(m.goles||[])).slice().sort((a,b)=>a.seg-b.seg);
  const p=progreso(m,now);
  if(!ev.length&&(!p||p.fin))return "";
  const escala=p&&p.escala||90;
  const marca=e=>{const n=parseInt(e.min,10)||0;return `<i class="ev ${e.t} ${e.lado}" style="left:${Math.min(100,100*n/escala)}%" title="${esc((e.t==="g"?"Gol ":"Roja ")+e.j+" "+e.min)}"></i>`};
  const barra=p?`<div class="tbar" role="img" aria-label="${esc(p.fin?"Partido terminado":(tiempo(m,now)||{}).l||"")}"><span class="tb-fill${p.fin?" fin":""}" style="width:${p.pct}%"></span><span class="tb-ht"></span>${ev.map(marca).join("")}</div><div class="tb-ejes"><span>0'</span><span>Descanso</span><span>${escala}'</span></div>`:"";
  const lado=l=>ev.filter(e=>e.lado===l).map(e=>`<li>${e.t==="g"?'<span class="ico-gol" aria-label="Gol">⚽</span>':'<span class="ico-roja" aria-label="Roja"></span>'} ${esc(nomJug(e.j))} <b>${esc(e.min)}</b>${e.pen?" <small>(pen.)</small>":""}${e.pp?" <small>(p.p.)</small>":""}</li>`).join("");
  const lista=ev.length?`<div class="goles"><ul>${lado("L")}</ul><ul class="v">${lado("V")}</ul></div>`:"";
  return `<div class="partido-vivo">${barra}${lista}</div>`;
}
function countdown(m,now){
  const d=new Date(m.inicio).getTime()-now;
  const st=status(m,now);
  if(st==="off")return m.estado==="suspendido"?"Partido suspendido":"Partido aplazado";
  if(st==="done"&&tieneMarcador(m))return "Resultado final";
  if(st==="live"){const t=tiempo(m,now);if(t)return "En juego · "+t.l}
  if(d<=0)return st==="live"?"Se está jugando ahora":"Partido terminado";
  const days=Math.floor(d/864e5),hrs=Math.floor(d%864e5/36e5),min=Math.floor(d%36e5/6e4);
  if(days>0)return `Empieza en ${days} d ${hrs} h`;
  if(hrs>0)return `Empieza en ${hrs} h ${min} min`;
  return `Empieza en ${min} min`;
}
function chip(c){const k=chOf(c);return `<span class="chip op-${k.op}"><span class="lg">${esc(k.short)}</span>${esc(k.name)}${k.dial?` <span class="dial">${esc(k.dial)}</span>`:""}</span>`}
function ago(iso){
  const d=(Date.now()-new Date(iso).getTime())/36e5;
  if(d<1/60)return "hace un momento";
  if(d<1)return `hace ${Math.max(1,Math.round(d*60))} min`;
  if(d<24)return `hace ${Math.round(d)} h`;
  return `el ${fStamp.format(new Date(iso))}`;
}

/* Estadística de las pasadas del robot de datos (data/partidos.json → "robot"). */
function resumenPasada(h){
  const p=[];
  if(h.nuevos)p.push(h.nuevos+(h.nuevos===1?" partido nuevo":" partidos nuevos"));
  if(h.resultados)p.push(h.resultados+(h.resultados===1?" resultado":" resultados"));
  if(h.canales)p.push(h.canales+(h.canales===1?" canal":" canales"));
  if(h.horas)p.push(h.horas+(h.horas===1?" horario":" horarios"));
  if(h.tablas&&h.tablas.length)p.push("clasificación de "+h.tablas.join(", "));
  return p.length?p.join(" · "):"sin cambios";
}
let statCat=null;
const ST_TIT={resultados:"Resultados guardados",canales:"Canales actualizados",horas:"Horarios cambiados",nuevos:"Partidos añadidos"};
function detalleStat(dia,cat,fh){
  const vistos=new Set(),filas=[];
  for(const h of dia){for(const it of ((h.items||{})[cat]||[])){if(vistos.has(it.id))continue;vistos.add(it.id);filas.push({...it,hora:h.hora})}}
  const cuerpo=filas.length?`<ul class="st-lista">${filas.map(it=>{
      const m=matches&&matches.find(x=>x._id===it.id);
      let extra="";
      if(cat==="canales"&&m&&(m.canales||[]).length){const k=chOf(m.canales[0]);extra=k.name+(k.dial&&k.dial!=="TDT"?" · dial "+k.dial:"")+(m.provisional?" · provisional":"")}
      if(m&&cat!=="horas"&&cat!=="resultados")extra=(extra?extra+" · ":"")+cap(fDayShort.format(new Date(m.inicio))).replace(".","")+" "+fTime.format(new Date(m.inicio));
      return `<li><button type="button" data-abrir="${esc(it.id)}"${m?"":" disabled"}><b>${esc(it.t)}</b>${extra?`<span>${esc(extra)}</span>`:""}<em>${esc(fh(it.hora))}</em></button></li>`}).join("")}</ul>`
    :`<p class="note">El detalle se guarda desde hoy: aparecerá aquí en la próxima comprobación con cambios.</p>`;
  return `<div class="st-det"><p class="st-t">${ST_TIT[cat]} · últimas 24 h</p>${cuerpo}</div>`;
}

      ${statCat?detalleStat(dia,statCat,fh):`<p class="st-ayuda">Toca un número para ver qué ha cambiado.</p>`}
      ${conCambios&&conCambios.detalle&&conCambios.detalle.length?`<p class="st-t">Lo último (${esc(fh(conCambios.hora))})</p><ul class="det">${conCambios.detalle.slice(0,8).map(x=>`<li>${esc(x)}</li>`).join("")}${conCambios.detalle.length>8?`<li class="mas">y ${conCambios.detalle.length-8} más</li>`:""}</ul>`:""}

    </section>`;

const SEGUIDOS=new Set();
function seguirFavsEnJuego(){
  if(!window.AndroidApp||!window.AndroidApp.seguirPartido||!matches||!FAV.size)return;
  if(AJ.goles==="no"&&!AJ.final)return;
  const now=Date.now();
  for(const m of matches){
    if(SEGUIDOS.has(m._id)||status(m,now)!=="live"||!(FAV.has(m.localId)||FAV.has(m.visitanteId)))continue;
    SEGUIDOS.add(m._id);
    try{window.AndroidApp.seguirPartido(JSON.stringify({id:m._id,liga:m.liga,local:m.local,visitante:m.visitante,localId:m.localId,visitanteId:m.visitanteId,inicio:new Date(m.inicio).getTime()}))}catch(e){}
  }
}

  if(matches)for(const m of matches){if(status(m,now)!=="live")continue;n[m.liga]=(n[m.liga]||0)+1;if(FAV.size&&(FAV.has(m.localId)||FAV.has(m.visitanteId)))n[0]=(n[0]||0)+1}
  document.querySelectorAll(".tabs button").forEach(b=>{

  for(const l of h.split("\n")){

/* ---------- Marcadores (football-data.org, plan gratuito: con algunos minutos de retraso) ----------
   config.js define window.MARCADORES = {clave, competiciones:{1:"PD",4:"CL"}}. Sin eso no se consulta nada. */
const VIVO={};               // _id -> {marcador, estado, minuto}
let vivoTimer=null, vivoUltimo=0, vivoFuente=false, vivoOk=0, vivoFallo="";
function notaVivo(){
  const s=vivoOk?Math.max(0,Math.round((Date.now()-vivoOk)/1000)):null;
  const cuando=s==null?"":s<60?` · comprobado hace ${s} s`:` · comprobado hace ${Math.round(s/60)} min`;
  if(actual&&actual.liga===5)return (rfefFuente==="FotMob"?"Marcador en directo de FotMob":"Marcador en directo de VAVEL (se actualiza cada minuto; el minuto de juego es aproximado)")+(vivoOkRfef?` · comprobado hace ${Math.max(0,Math.round((Date.now()-vivoOkRfef)/1000))} s`:"");
  return (vivoFuente==="ESPN"?"Marcador en directo de ESPN":"Marcador de football-data.org (va unos minutos por detrás de la tele)")+cuando+(vivoFallo&&Date.now()-vivoOk>150e3?" · ahora mismo no responde, se reintenta cada minuto":"");
}
const FD_ESTADO={IN_PLAY:"directo",PAUSED:"directo",FINISHED:"final",AWARDED:"final",POSTPONED:"aplazado",SUSPENDED:"suspendido",CANCELLED:"aplazado"};
const QUITAR=new Set(["fc","cf","cd","ud","sd","rcd","ad","ce","club","de","del","la","el","real","sad","ac","as","afc","sc","sv","vfb","fk","ssc","rc","bv","sport","balompie","futbol","calcio","1."]);
function toks(n){return String(n||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(w=>w.length>2&&!QUITAR.has(w))}
function parecido(nuestro,fd){
  const a=toks(nuestro.name), b=new Set([...toks(fd.name),...toks(fd.shortName)]);
  if(fd.tla&&nuestro.abbr&&fd.tla.toUpperCase()===nuestro.abbr.toUpperCase())return true;
  return a.some(w=>b.has(w)||[...b].some(x=>x.startsWith(w)||w.startsWith(x)));
}
function enVentana(m,now){const k=new Date(m.inicio).getTime();return now>k-15*60e3&&now<k+3*36e5}
/* Fuente principal del directo: marcador público de ESPN (a través del worker, caché de 20 s): marcador, minuto y parte al momento.
   Respaldo: football-data.org (solo Primera y Champions, con unos minutos de retraso). */
const VIVO_ESPN={1:"esp.1",2:"esp.2",3:"esp.copa_del_rey",4:"uefa.champions",6:"uefa.europa.conf"};
const enJuegoPosible=(m,now)=>m.estado!=="final"&&now>new Date(m.inicio).getTime()-15*60e3&&now<new Date(m.inicio).getTime()+4*36e5;
function necesitaMarcador(now){
  if(!matches)return false;
  const cfg=window.MARCADORES;
  return matches.some(m=>(VIVO_ESPN[m.liga]||m.liga===5||(cfg&&cfg.competiciones&&cfg.competiciones[m.liga]))&&enJuegoPosible(m,now));
}
const fechaEspn=iso=>fechaMad(iso).replace(/-/g,"");
async function marcadoresEspn(now){
  if(!window.IA_URL)return false;
  const lista=matches.filter(m=>VIVO_ESPN[m.liga]&&enJuegoPosible(m,now));
  if(!lista.length)return false;
  const ligas=[...new Set(lista.map(m=>VIVO_ESPN[m.liga]))],fechas=[...new Set(lista.map(m=>fechaEspn(m.inicio)))].slice(0,2);
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),12000);
  let d;
  try{const r=await fetch(window.IA_URL.replace(/\/$/,"")+"/vivo?ligas="+ligas.join(",")+"&fechas="+fechas.join(","),{cache:"no-store",signal:ctl.signal});if(!r.ok)return false;d=await r.json()}
  catch(e){return false}finally{clearTimeout(t)}
  const porLiga={};for(const k in VIVO_ESPN)porLiga[VIVO_ESPN[k]]=+k;
  // Nombres de ESPN que no se parecen a los de la guía
  const ALIAS={"Heart of Midlothian":"Hearts","Red Star Belgrade":"Crvena Zvezda","FC Copenhagen":"København"};
  const ali=t=>t&&ALIAS[t.name]?{...t,name:ALIAS[t.name],shortName:ALIAS[t.name]}:t;
  for(const x0 of d.partidos||[]){
    const x={...x0,homeTeam:ali(x0.homeTeam),awayTeam:ali(x0.awayTeam)};
    const liga=porLiga[x.liga];if(!liga)continue;
    const tt=new Date(x.utcDate).getTime();
    const m=matches.find(m=>m.liga===liga&&Math.abs(new Date(m.inicio).getTime()-tt)<3*36e5
      &&parecido(teamOf(m.localId,m.local,m.localAbbr),x.homeTeam||{})&&parecido(teamOf(m.visitanteId,m.visitante,m.visitanteAbbr),x.awayTeam||{}));
    if(!m)continue;
    let v=null;
    if(x.estado==="in"){
      v={estado:"directo",enJuego:true,parte:x.parte||0,minuto:/HALFTIME/.test(x.detalle)?"Descanso":(x.reloj||null)};
      if(/PENALT|SHOOTOUT/.test(x.detalle)||x.parte===5)v.minuto="Penaltis";
    }else if(x.estado==="post"){
      if(/POSTPONED|CANCELED|CANCELLED/.test(x.detalle))v={estado:"aplazado",minuto:null};
      else if(/SUSPENDED|ABANDONED/.test(x.detalle))v={estado:"suspendido",minuto:null};
      else v={estado:"final",minuto:null,enJuego:false,parte:0};
    }else if(/POSTPONED/.test(x.detalle))v={estado:"aplazado",minuto:null};
    if(!v)continue;
    if(x.estado!=="pre"&&x.gl!=null&&x.gv!=null)v.marcador=[x.gl,x.gv];
    if(Array.isArray(x.eventos))v.eventos=x.eventos;
    VIVO[m._id]=v;
  }
  vivoFuente="ESPN";vivoOk=Date.now();vivoFallo="";
  aplicarVivo();render();refrescarFicha();
  return true;
}
async function pedirJSON(url,clave){
  // 1) A través del worker de Cloudflare (sirve para la web, que no puede consultar football-data directamente,
  //    y guarda la respuesta un minuto para todos, así no se agota el límite gratuito).
  if(window.IA_URL){
    try{
      const q=url.split("?")[1],ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),12000);
      const r=await fetch(window.IA_URL.replace(/\/$/,"")+"/marcadores?"+q,{cache:"no-store",signal:ctl.signal});clearTimeout(t);
      if(r.ok)return await r.json();
    }catch(e){}
  }
  try{
    const r=await fetch(url,{headers:{"X-Auth-Token":clave},cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    return await r.json();
  }catch(e){
    // En la app, si el navegador interno no deja la consulta, la hace Android.
    if(window.AndroidApp&&window.AndroidApp.pedir)return await new Promise((ok,ko)=>{
      const id="r"+Date.now()+Math.random().toString(36).slice(2);
      window.__resp=window.__resp||{};
      window.__resp[id]=(st,body)=>{delete window.__resp[id];if(st>=200&&st<300){try{ok(JSON.parse(body))}catch(x){ko(x)}}else ko(new Error("HTTP "+st))};
      window.AndroidApp.pedir(id,url,"X-Auth-Token",clave);
      setTimeout(()=>{if(window.__resp[id]){delete window.__resp[id];ko(new Error("timeout"))}},15000);
    });
    throw e;
  }
}
/* 1ª RFEF en directo: marcador y estado del calendario de VAVEL (a través del worker, caché de 60 s). Sin minuto. */
async function marcadoresRfef(now){
  if(!window.IA_URL||!matches)return false;
  const lista=matches.filter(m=>m.liga===5&&enJuegoPosible(m,now));
  if(!lista.length)return false;
  let d;
  try{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),12000);const r=await fetch(window.IA_URL.replace(/\/$/,"")+"/rfef",{cache:"no-store",signal:ctl.signal});clearTimeout(t);if(!r.ok)return false;d=await r.json()}catch(e){return false}
  for(const x of d.partidos||[]){
    const m=lista.find(m=>parecido(teamOf(m.localId,m.local,m.localAbbr),{name:x.local})&&parecido(teamOf(m.visitanteId,m.visitante,m.visitanteAbbr),{name:x.visitante}));
    if(!m)continue;
    if(x.gl==null||x.gv==null)continue;
    const v={marcador:[x.gl,x.gv],minuto:null,parte:x.parte||0};
    if(x.estado==="in"){v.estado="directo";v.enJuego=true;if(/descanso/i.test(x.detalle))v.minuto="Descanso";else if(x.reloj)v.minuto=x.reloj}
    else if(/aplaz/i.test(x.detalle)){v.estado="aplazado";v.marcador=null}
    else{v.estado="final";v.enJuego=false}
    if(Array.isArray(x.eventos)&&x.eventos.length)v.eventos=x.eventos;
    rfefFuente=d.fuente||"VAVEL";
    VIVO[m._id]=v;
  }
  vivoOkRfef=Date.now();
  aplicarVivo();render();refrescarFicha();
  return true;
}
let fdUltimo=0,vivoOkRfef=0,rfefFuente="VAVEL";
async function actualizarMarcadores(){
  const cfg=window.MARCADORES,now=Date.now();
  if(!necesitaMarcador(now))return;
  if(now-vivoUltimo<25e3)return;
  vivoUltimo=now;
  marcadoresRfef(now);
  if(await marcadoresEspn(now))return;
  if(!cfg||!cfg.clave||now-fdUltimo<55e3)return;
  fdUltimo=now;
  const dia=t=>new Date(t).toISOString().slice(0,10);
  const codes=[...new Set(Object.values(cfg.competiciones))].join(",");
  const url=`https://api.football-data.org/v4/matches?competitions=${codes}&dateFrom=${dia(now-864e5)}&dateTo=${dia(now+864e5)}`;
  let d;try{d=await pedirJSON(url,cfg.clave)}catch(e){vivoFallo=String(e&&e.message||e);const n=document.getElementById("vivo-nota");if(n)n.textContent=notaVivo();return}
  vivoFuente="football-data.org";vivoOk=Date.now();vivoFallo="";
  const porLiga={};for(const k in cfg.competiciones)porLiga[cfg.competiciones[k]]=+k;
  for(const x of d.matches||[]){
    const liga=porLiga[x.competition&&x.competition.code];if(!liga)continue;
    const t=new Date(x.utcDate).getTime();
    const m=matches.find(m=>m.liga===liga&&Math.abs(new Date(m.inicio).getTime()-t)<3*36e5
      &&parecido(teamOf(m.localId,m.local,m.localAbbr),x.homeTeam||{})&&parecido(teamOf(m.visitanteId,m.visitante,m.visitanteAbbr),x.awayTeam||{}));
    if(!m)continue;
    const est=FD_ESTADO[x.status];if(!est)continue;
    const sc=x.score&&x.score.fullTime||{};
    const v={estado:est,minuto:null,enJuego:x.status==="IN_PLAY"};
    if(sc.home!=null&&sc.away!=null)v.marcador=[sc.home,sc.away];
    if(x.status==="PAUSED")v.minuto="Descanso";else if(x.minute)v.minuto=x.minute+"'";
    VIVO[m._id]=v;
  }
  aplicarVivo();render();refrescarFicha();
}
function aplicarVivo(){
  if(!matches)return;
  for(const m of matches){const v=VIVO[m._id];if(!v||m.estado==="final"&&!v.marcador)continue;Object.assign(m,v)}
}
function programarMarcadores(){
  if(!window.MARCADORES)return;
  vivoTimer=true;          // el reloj de cada minuto está en refrescar()
  actualizarMarcadores();
}

/* ---------- Historial entre equipos (robot/historial.py, fuente football-data.co.uk) ---------- */
const H2H={};
function h2hDe(id){
  if(!id||!window.H2H_URL)return Promise.resolve(null);
  if(!H2H[id])H2H[id]=fetch(window.H2H_URL+encodeURIComponent(id)+".json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).catch(()=>null);
  return H2H[id];
}
const nomCorto=id=>{const t=T[id];return t?t.name:nombreEquipo(id)};
const fCorta=iso=>{const [y,m,d]=iso.split("-");return `${+d}/${+m}/${y.slice(2)}`};
function resLetra(gf,gc){return gf>gc?"G":gf===gc?"E":"P"}
/* Tres fuentes según la competición:
   - Primera, Segunda y Copa entre equipos de ambas: CSV de football-data.co.uk (liga desde 2000, con estadísticas).
   - 1ª RFEF: resultados de esta temporada (VAVEL, los guarda el robot en h2h/rfef.json).
   - Champions: football-data.org a través del worker (enfrentamientos oficiales y forma en todas las competiciones). */
const H2H_REMOTO={};
const fechaMad=iso=>new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Madrid",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(iso));
async function datosH2H(m){
  if(!m.localId||!m.visitanteId)return null;
  if(m.liga===5)return rfefH2H(m);
  if(m.liga===1||m.liga===2||m.liga===3){
    const [a,b]=await Promise.all([h2hDe(m.localId),h2hDe(m.visitanteId)]);
    if(a&&b)return {a,b,vs:a.rivales&&a.rivales[m.visitanteId]||null,
      alcance:`partidos de liga desde ${a.desde||2000}`,sinDuelos:"No se han enfrentado en Primera ni en Segunda desde 2000.",
      fuente:"football-data.co.uk",pie:"Liga (Primera y Segunda). Forma: últimos 5 partidos de liga, el más reciente a la derecha. Fuente: football-data.co.uk."};
    if(m.liga!==3)return a||b?{a:a||{},b:b||{},vs:null,alcance:"",sinDuelos:"Sin historial entre ambos.",fuente:"football-data.co.uk",pie:"Fuente: football-data.co.uk."}:null;
    return null;
  }
  if(m.liga===4)return remotoH2H(m,"CL");
  if(m.liga===6){
    // Conference: no hay historial gratuito entre clubes; sí la forma en liga de los equipos españoles.
    const [a,b]=await Promise.all([m.localId.length===3?h2hDe(m.localId):null,m.visitanteId.length===3?h2hDe(m.visitanteId):null]);
    if(!a&&!b)return null;
    return {a:a||{},b:b||{},vs:null,alcance:"",sinDuelos:"No hay historial gratuito de enfrentamientos en Conference League.",fuente:"football-data.co.uk",
      pie:"Forma en liga (Primera o Segunda) de los equipos españoles: últimos 5 partidos, el más reciente a la derecha. Fuente: football-data.co.uk."};
  }
  return null;
}
async function rfefH2H(m){
  const d=await h2hDe("rfef");if(!d||!d.resultados)return null;
  const R=d.resultados,de=id=>R.filter(r=>r[3]===id||r[4]===id);
  const forma=id=>de(id).slice().sort((x,y)=>y[0].localeCompare(x[0])).slice(0,5).map(r=>{const c=r[3]===id;return [r[0],c?r[4]:r[3],c?"C":"F",c?r[5]:r[6],c?r[6]:r[5],"1ª RFEF"]});
  const vs={pj:0,g:0,e:0,p:0,gf:0,gc:0,ult:[]};
  for(const r of R.filter(r=>(r[3]===m.localId&&r[4]===m.visitanteId)||(r[3]===m.visitanteId&&r[4]===m.localId)).sort((x,y)=>y[0].localeCompare(x[0]))){
    const c=r[3]===m.localId,gf=c?r[5]:r[6],gc=c?r[6]:r[5];

/* ---------- Datos ----------
   1) Última guía guardada en el móvil, para abrir al instante y sin conexión.
   2) Si no hay, la copia que viene dentro de la app (partidos.json).
   3) Después, la guía actualizada del repositorio de GitHub (config.js → DATOS_URL). */
function aplicar(d,origen){
  if(!d||!Array.isArray(d.partidos))return false;
  matches=d.partidos.map(p=>({_id:p.id,...p})).filter(m=>m.inicio);
  meta={actualizado:d.actualizado,robot:d.robot||null};
  CLAS=d.clasificacion||null;
  if(origen)dbState=origen;
  aplicarVivo();render();refrescarFicha();
  if(!menuEl.hidden){const y=menuEl.scrollTop;pintarMenu();menuEl.scrollTop=y}
  if(!vivoTimer)programarMarcadores();
  return true;
}
function guardada(){try{return JSON.parse(localStorage.getItem("dle-guia")||"null")}catch(e){return null}}
async function actualizar(){
  const url=window.DATOS_URL;
  if(!url){if(dbState==="loading"){dbState="ok";render()}return}
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),10000);
  try{
    const r=await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store",signal:ctl.signal});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    const g=guardada();
    if(!g||new Date(d.actualizado)>=new Date(g.actualizado||0)){
      try{localStorage.setItem("dle-guia",JSON.stringify(d))}catch(e){}
      aplicar(d,"ok");
    }else{dbState="ok";renderFresh()}
  }catch(e){dbState="offline";renderFresh()}
  finally{clearTimeout(t)}
}
/* Con la app abierta, los resultados se refrescan solos:
   - Primera y Champions: marcador de football-data cada minuto (actualizarMarcadores).
   - Todo lo demás (Hypermotion, 1ª RFEF, Copa, clasificaciones): se vuelve a leer la guía
     cada 3 min si hay algún partido en juego y cada 15 min si no. En segundo plano no se gasta nada. */
let ultima=0;
// En la app, Android avisa de cuándo está en primer plano (window.__oculta); en la web, el navegador (document.hidden).
const oculta=()=>window.AndroidApp?window.__oculta===true:document.hidden;
function hayJuego(now){return !!matches&&matches.some(m=>{const k=new Date(m.inicio).getTime();return m.estado!=="final"&&now>k-15*60e3&&now<k+3*36e5})}
function cadaCuanto(){return hayJuego(Date.now())?3*60e3:15*60e3}
/* Web: si se ha publicado una versión nueva y el navegador sigue con la vieja guardada, recargar
   (solo si no hay nada abierto, para no cortar a nadie). */
let versionVista=0;
async function comprobarVersion(){
  if(!ES_WEB||!window.VERSION_WEB||Date.now()-versionVista<5*60e3)return;
  versionVista=Date.now();
  try{
    const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;
    const d=await r.json();
    if(!d.v||d.v===window.VERSION_WEB||!iaEl.hidden||!menuEl.hidden||(!esEscritorio()&&!sheet.hidden))return;
    let ya="";try{ya=sessionStorage.getItem("dle-recarga")||""}catch(e){}
    if(ya===d.v)return;              // ya se recargó por esta versión: no entrar en bucle si el navegador insiste en la vieja
    try{sessionStorage.setItem("dle-recarga",d.v)}catch(e){}
    location.reload();
  }catch(e){}
}
/* El robot pasa cada hora hacia el minuto 7 y tarda 1–3 min: entre el 9 y el 16 se mira cada 2 min,
   y también si la última comprobación del robot tiene más de una hora. */
function tocaRobot(now){
  const mi=new Date(now).getMinutes();
  const rb=meta&&meta.robot&&meta.robot.comprobado?new Date(meta.robot.comprobado).getTime():0;
  return (mi>=9&&mi<=16)||(rb&&now-rb>63*60e3);
}
function refrescar(forzar){
  if(oculta())return;
  comprobarVersion();
  const now=Date.now();
  if(forzar||now-ultima>=cadaCuanto()||(tocaRobot(now)&&now-ultima>=2*60e3)){ultima=now;actualizar()}
  actualizarMarcadores();
}
setInterval(()=>refrescar(false),30e3);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){refrescar(Date.now()-ultima>Math.min(cadaCuanto(),5*60e3));render()}});
const firmaFicha=x=>JSON.stringify([x.marcador,x.estado,(x.eventos||[]).length,(x.goles||[]).length,x.canales,x.inicio,x.horaPendiente,x.provisional]);
let fichaPintada="";
/* Si la ficha de un partido está abierta y cambia su marcador, estado o canal, se repinta sin moverla. */
function refrescarFicha(){
  if(!actual||sheet.hidden||!matches)return;
  const m=matches.find(x=>x._id===actual._id);if(!m)return;
  // Se compara con lo que se pintó (el marcador en directo cambia el mismo objeto, no basta con mirar si es otro).
  if(firmaFicha(m)===fichaPintada){actual=m;return}
  const y=sheet.scrollTop,lf=lastFocus,foco=document.activeElement;
  open(m._id);sheet.scrollTop=y;lastFocus=lf;try{foco&&foco.focus({preventScroll:true})}catch(e){}
}
window.alVolver=()=>{refrescar(Date.now()-ultima>Math.min(cadaCuanto(),5*60e3));if(!menuEl.hidden){const y=menuEl.scrollTop;pintarMenu();menuEl.scrollTop=y}};
window.abrirPartido=id=>{if(!matches)return;const m=matches.find(x=>x._id===id);if(m){league=m.liga;render();open(id)}};
window.atras=()=>{if(!iaEl.hidden){iaCerrar();return true}if(!menuEl.hidden){cerrarMenu();return true}if(esEscritorio()){if(actual){close();return true}return false}if(!sheet.hidden){close();return true}return false};

(async()=>{
  try{const r=await fetch("escudos/lista.json");if(r.ok)ESCUDOS=new Set(await r.json())}catch(e){}
  if(!aplicar(guardada())){
    try{const r=await fetch("partidos.json");if(r.ok)aplicar(await r.json())}catch(e){}
  }
  ultima=Date.now();
  actualizar();
})();
setInterval(render,60e3);
// La ficha abierta de un partido en juego actualiza su minuto.
setInterval(()=>{if(actual&&!sheet.hidden&&status(actual,Date.now())==="live"){const c=sheet.querySelector(".count");if(c)c.textContent=countdown(actual,Date.now());const pv=sheet.querySelector(".partido-vivo");if(pv){const h=eventosHTML(actual,Date.now());if(h)pv.outerHTML=h}const n=document.getElementById("vivo-nota");if(n)n.textContent=notaVivo()}},15e3);
</script>
</body>
