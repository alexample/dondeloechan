name: Explorar fuentes (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  explorar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Descargar páginas de muestra
        run: |
          mkdir -p muestras && cd muestras
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36"
          g(){ curl -sSL -A "$UA" -H "Accept-Language: es-ES,es;q=0.9" --max-time 40 -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 FALLO"; }
          g fel_laliga.html https://www.futbolenlatv.es/competicion/la-liga
          g fel_ucl.html https://www.futbolenlatv.es/competicion/liga-campeones
          g ll1_clas.html https://www.laliga.com/laliga-easports/clasificacion
          g ll1_res.html https://www.laliga.com/laliga-easports/resultados
          g ll1_j9.html https://www.laliga.com/laliga-easports/resultados/2026-27/jornada-9
          g ll2_j10.html https://www.laliga.com/laliga-hypermotion/resultados/2026-27/jornada-10
          for v in laliga laliga-ea-sports la-liga primera-division laliga-2 segunda-division laliga-hypermotion-2 champions-league uefa-champions-league liga-de-campeones copa-del-rey; do g vv_$v.html https://www.vavel.com/es/data/$v/resultados/; done
          g vv_en_ucl.html https://www.vavel.com/en-us/data/champions-league/standings/
          g vv_en_ucl_res.html https://www.vavel.com/en-us/data/champions-league/results/
          g vv_g1_cal.html https://www.vavel.com/es/data/primera-federacion-grupo-1/calendario/
          ls -la
      - name: Guardar en la rama muestras
        run: |
          cd muestras
          git init -q -b muestras && git add -A
          git -c user.name=robot -c user.email=robot@users.noreply.github.com commit -qm muestras
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" muestras
