name: Probar asistente IA (temporal)
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          R=$(curl -sS -m 60 -X POST https://dondeloechan-ia.alexample.workers.dev/ -H "Origin: https://alexample.github.io" -H "Content-Type: application/json" \
            -d '{"pregunta":"¿Cuándo juega el Alavés y dónde lo echan?","hoy":"Miércoles, 21 de octubre, 18:15","contexto":"2627-1-10-ala-mal | LALIGA EA SPORTS Jornada 10 | Viernes, 23 de octubre 21:00 | Deportivo Alavés – Málaga CF | DAZN LALIGA (dial 55, Orange 113), DAZN en abierto | por jugar"}' -w ' HTTP %{http_code}')
          echo "::notice title=Respuesta::$(echo "$R" | tr '\n' ' ' | cut -c1-900)"
