name: Prueba fuentes (temporal)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,re,html
          def g(u):
              r=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"es-ES"})
              with urllib.request.urlopen(r,timeout=30) as x: return x.read().decode("utf-8","replace")
          t=g("https://www.futbolenlatv.es/competicion/primera-division-rfef")
          ctx=sorted(set(html.unescape(m) for m in re.findall(r'[^<>"]{0,40}[Ff][Aa][Nn][Pp][Ll][Aa][Yy][^<>"]{0,40}',t)))
          links=[l for l in re.findall(r'href="([^"]+)"',t) if re.search(r'real-union|europa',l)][:4]
          out=["COMP fanplay contextos: "+" | ".join(ctx[:15]),"links: "+" ".join(links)]
          for l in links[:2]:
              u=l if l.startswith("http") else "https://www.futbolenlatv.es"+l
              try:
                  d=g(u);c=sorted(set(html.unescape(m) for m in re.findall(r'[^<>"]{0,40}[Ff][Aa][Nn][Pp][Ll][Aa][Yy][^<>"]{0,40}',d)))
                  out.append(f"FICHA {u}: "+" | ".join(c[:10]))
              except Exception as e: out.append(f"FICHA {u}: {e}")
          for o in out: print("::notice::"+o[:1500])
          PY
