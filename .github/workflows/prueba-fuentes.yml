name: Prueba fuentes (temporal)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,re,html,json
          def g(u):
              r=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"es-ES"})
              with urllib.request.urlopen(r,timeout=30) as x: return x.read().decode("utf-8","replace")
          out=[]
          e=json.loads(g("https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.europa.conf/scoreboard?dates=20261022"))
          lg=e["leagues"][0]
          out.append("ESPN season="+json.dumps(lg.get("season"))[:200]+" calendar="+json.dumps(lg.get("calendar"))[:900])
          ev=e["events"][0]
          out.append("ESPN ev keys="+",".join(ev.keys())+" week="+str(ev.get("week"))+" season="+json.dumps(ev.get("season"))+" notes="+json.dumps(ev["competitions"][0].get("notes"))[:200]+" names="+" | ".join(c["team"]["displayName"] for x in e["events"][:6] for c in x["competitions"][0]["competitors"]))
          t=g("https://www.futbolenlatv.es/competicion/uefa-europa-conference-league")
          subs=re.findall(r'<label title="[^"]*">([^<]*)</label>\s*<span title="([^"]+)"',t)
          out.append("FEL subs="+str(sorted(set(subs))[:10]))
          for o in out: print("::notice::"+o)
          PY
