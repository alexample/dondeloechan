name: Prueba fuentes (temporal)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,re,html,json
          def g(u,h={}):
              try:
                  r=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"es-ES",**h})
                  with urllib.request.urlopen(r,timeout=30) as x: return x.status,x.read().decode("utf-8","replace")
              except Exception as e: return str(e)[:60],""
          out=[]
          st,t=g("https://www.futbolenlatv.es/competicion/liga-campeones")
          links=sorted(set(l for l in re.findall(r'href="(/competicion/[^"]+)"',t) if re.search(r'conf|europa|uefa',l)))
          out.append("FEL links: "+" ".join(links[:20]))
          st,t=g("https://www.futbolenlatv.es/")
          out.append("FEL home conf: "+" ".join(sorted(set(re.findall(r'href="(/competicion/[^"]*conf[^"]*)"',t)))[:10]))
          st,t=g("https://www.vavel.com/es/data/champions-league/calendario/")
          out.append("VAVEL links: "+" ".join(sorted(set(l for l in re.findall(r'href="(/es/data/[^"/]+)/',t) if re.search(r'conf|europa',l)))[:10]))
          st,t=g("https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.europa.conf/scoreboard?dates=20261022")
          try:
              e=json.loads(t);out.append("ESPN conf: "+" | ".join(ev['shortName']+' '+ev['status']['type']['name'] for ev in e['events'])[:700])
          except Exception as x: out.append("ESPN conf "+str(st))
          k="2e0b52f50c68465084f4da6f3c3c7613"
          r=[]
          for c in ["ECL","UCL","EL"]:
              st,t=g(f"https://api.football-data.org/v4/competitions/{c}/matches?dateFrom=2026-10-22&dateTo=2026-10-22",{"X-Auth-Token":k});r.append(f"{c}:{st}")
          out.append("FD "+" ".join(r))
          for o in out: print("::notice::"+o)
          PY
