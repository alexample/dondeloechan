name: Prueba fuentes (temporal)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          B=https://dondeloechan-ia.alexample.workers.dev/alineaciones
          O='Origin: https://alexample.github.io'
          echo "::notice::BAR-RMA $(curl -s -H "$O" "$B?liga=1&fecha=20261025&local=FC%20Barcelona&visitante=Real%20Madrid" | head -c 900)"
          echo "::notice::CUA-GIR(hoy, pre) $(curl -s -H "$O" "$B?liga=3&fecha=20261027&local=CD%20Cuarte&visitante=Girona%20FC" | head -c 300)"
          echo "::notice::ALC-IBI(rfef) $(curl -s -H "$O" "$B?liga=5&fecha=20261025&local=Alcorc%C3%B3n&visitante=UD%20Ibiza" | head -c 300)"
