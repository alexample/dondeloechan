name: Prueba fuentes (temporal)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,json,re,html
          def g(u,h={}):
              r=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64)","Accept":"*/*",**h})
              with urllib.request.urlopen(r,timeout=30) as x: return x.read().decode("utf-8","replace")
          out=[]
          for tipo in ["calendario","resultados"]:
              t=g(f"https://www.vavel.com/es/data/primera-federacion-grupo-1/{tipo}/")
              for tr in re.findall(r'<tr class="fx[^"]*">(.*?)</tr>',t,re.S):
                  if 'Uni' in tr and 'Lugo' in tr: out.append(f"VAVEL {tipo}: "+re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',tr)))[:200]+" RAW "+re.sub(r'\s+',' ',tr)[:400])
          for u in ["https://api.sofascore.com/api/v1/sport/football/scheduled-events/2026-10-23","https://www.fotmob.com/api/data/matches?date=20261023"]:
              try:
                  t=g(u);hits=[m for m in re.findall(r'[^{}]{0,80}Lugo[^{}]{0,80}',t)][:2]
                  out.append(f"{u[:40]} len={len(t)} lugo={hits}")
              except Exception as x: out.append(f"{u[:40]}: {str(x)[:50]}")
          for o in out: print("::notice::"+o[:1500])
          PY
