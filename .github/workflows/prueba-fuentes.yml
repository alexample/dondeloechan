name: Prueba fuentes (temporal)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,json
          out=[]
          for q in ["dates=20260829-20261219","dates=20261001-20261219","dates=20261001-20261219&limit=200","dates=20261001-20261219&limit=1000","dates=2026"]:
              try:
                  r=urllib.request.Request("https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.europa.conf/scoreboard?"+q,headers={"User-Agent":"Mozilla/5.0"})
                  e=json.loads(urllib.request.urlopen(r,timeout=30).read())
                  ds=sorted(set(ev["date"][:10] for ev in e.get("events",[])))
                  out.append(f"{q}: n={len(e.get('events',[]))} fechas={ds}")
              except Exception as x: out.append(f"{q}: {x}")
          print("::notice::"+" ## ".join(out))
          PY
