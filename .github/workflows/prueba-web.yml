name: Prueba web (temporal)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const pp=require('puppeteer-core');
          (async()=>{const b=await pp.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const p=await b.newPage();await p.setViewport({width:390,height:844});
          await p.evaluateOnNewDocument(()=>{localStorage.setItem('dle-consent',JSON.stringify({v:1,terceros:false}));localStorage.setItem('dle-league','6')});
          await p.goto('https://alexample.github.io/dondeloechan/',{waitUntil:'networkidle2'});await new Promise(r=>setTimeout(r,5000));
          const tab=await p.$eval('#tab-6',e=>e.innerText.replace(/\s+/g,' '));
          const f=(await p.$$eval('#app .match',x=>x.map(y=>y.innerText.replace(/\s+/g,' ')).filter(t=>/EN JUEGO|'|Descanso|FINAL/i.test(t)).slice(0,12).map(t=>t.split(' LC')[0]))).join(' | ');
          console.log('::notice::TAB '+tab+' ## '+f);
          await b.close()})();
          JS
          node t.js
