name: Prueba web en directo (temporal)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const pp=require('puppeteer-core');
          const fdTxt=async(origin)=>{const d1=new Date(Date.now()-864e5).toISOString().slice(0,10),d2=new Date(Date.now()+864e5).toISOString().slice(0,10);
            const r=await fetch(`https://dondeloechan-ia.alexample.workers.dev/marcadores?competitions=PD,CL&dateFrom=${d1}&dateTo=${d2}`,{headers:{Origin:origin}});
            const t=await r.text();try{const d=JSON.parse(t);return r.status+' '+d.matches.filter(m=>/IN_PLAY|PAUSED/.test(m.status)||m.utcDate>new Date(Date.now()-3*36e5).toISOString()&&m.utcDate<new Date().toISOString()).map(m=>`${m.homeTeam.shortName} ${m.score.fullTime.home}-${m.score.fullTime.away} ${m.awayTeam.shortName} ${m.status} min=${m.minute}`).join(' | ')}catch(e){return r.status+' '+t.slice(0,150)}};
          (async()=>{
            const out=[];
            out.push('FD(web): '+await fdTxt('https://alexample.github.io'));
            out.push('FD(app): '+await fdTxt('https://appassets.androidplatform.net'));
            const b=await pp.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const p=await b.newPage();
            const red=[];p.on('response',r=>{if(/workers.dev/.test(r.url()))red.push(r.status())});
            const errs=[];p.on('console',m=>{if(m.type()==='error')errs.push(m.text().slice(0,120))});
            await p.goto('https://alexample.github.io/dondeloechan/',{waitUntil:'networkidle2'});
            await p.click('#tab-4');await new Promise(r=>setTimeout(r,3000));
            const vivo=async()=>(await p.$$eval('#app .match',x=>x.map(y=>y.innerText.replace(/\s+/g,' ')).filter(t=>/EN JUEGO|'|Descanso|Final/i.test(t)).slice(0,14))).join(' | ');
            out.push('WEB t0: '+await vivo());
            await new Promise(r=>setTimeout(r,130000));
            out.push('WEB t+130s: '+await vivo()+' · peticiones worker='+red.join(','));
            out.push('FD ahora: '+await fdTxt('https://alexample.github.io'));
            out.push('ERR: '+errs.join(' ; '));
            for(const o of out)console.log('::notice::'+o);
            await b.close()})();
          JS
          node t.js
