name: Prueba web (temporal)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const pp=require('puppeteer-core');
          (async()=>{const b=await pp.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const p=await b.newPage();await p.setViewport({width:390,height:844});
          await p.evaluateOnNewDocument(()=>{localStorage.setItem('dle-consent',JSON.stringify({v:1,terceros:false}));localStorage.setItem('dle-league','4')});
          await p.goto('https://alexample.github.io/dondeloechan/',{waitUntil:'networkidle2'});await new Promise(r=>setTimeout(r,4000));
          const out=[];
          for(const id of ['2627-4-fase-liga-j3-rma-rb-leipzig','2627-4-fase-liga-j3-bet-feyenoord','2627-4-fase-liga-j3-bayern-munich-arsenal']){
            await p.evaluate(id=>window.abrirPartido(id),id);await new Promise(r=>setTimeout(r,800));
            out.push(id.split('j3-')[1]+': '+await p.$eval('#sheet .vs .mid',e=>e.textContent).catch(()=>'')+' · '+await p.$eval('#sheet .count',e=>e.textContent).catch(()=>'')+' · barra='+await p.$eval('.tb-fill',e=>e.style.width).catch(()=>'no')+' · '+await p.$eval('.goles',e=>e.innerText.replace(/\s+/g,' ')).catch(()=>'sin goles'));
          }
          for(const o of out)console.log('::notice::'+o);
          await b.close()})();
          JS
          node t.js
