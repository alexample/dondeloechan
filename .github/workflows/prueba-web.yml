name: Prueba web (temporal)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::notice::RFEF $(curl -s -H 'Origin: https://alexample.github.io' https://dondeloechan-ia.alexample.workers.dev/rfef | head -c 1200)"
          npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const pp=require('puppeteer-core');
          (async()=>{const b=await pp.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const p=await b.newPage();await p.setViewport({width:390,height:844});
          await p.evaluateOnNewDocument(()=>{localStorage.setItem('dle-consent',JSON.stringify({v:1,terceros:false}));localStorage.setItem('dle-league','5')});
          await p.goto('https://alexample.github.io/dondeloechan/',{waitUntil:'networkidle2'});await new Promise(r=>setTimeout(r,5000));
          const f=(await p.$$eval('#app .match',x=>x.map(y=>y.innerText.replace(/\s+/g,' ')).filter(t=>/Lugo|Zaragoza/.test(t)).slice(0,2).map(t=>t.slice(0,70)))).join(' | ');
          await p.evaluate(()=>window.abrirPartido('2627-5-9-real-union-cd-lugo'));await new Promise(r=>setTimeout(r,1500));
          const g=await p.$eval('.goles',e=>e.innerText.replace(/\s+/g,' ')).catch(()=>'sin goles');
          console.log('::notice::WEB '+f+' ## FICHA R.Unión–Lugo: '+g);
          await b.close()})();
          JS
          node t.js
