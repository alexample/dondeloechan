name: Prueba web (temporal)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const pp=require('puppeteer-core');
          (async()=>{const b=await pp.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const p=await b.newPage();await p.setViewport({width:390,height:844});
          await p.evaluateOnNewDocument(()=>{localStorage.setItem('dle-consent',JSON.stringify({v:1,terceros:false}));localStorage.setItem('dle-league','3')});
          await p.goto('https://alexample.github.io/dondeloechan/',{waitUntil:'networkidle2'});await new Promise(r=>setTimeout(r,3000));
          await p.evaluate(()=>window.abrirPartido('2627-3-primera-ronda-sporting-de-alcazar-mal'));await new Promise(r=>setTimeout(r,1500));
          await p.click('#ia-fab');await new Promise(r=>setTimeout(r,800));
          const chips=await p.$$eval('.ia-sug button',x=>x.map(y=>y.textContent));
          const out=['CHIPS '+chips.join(' / ')];
          for(const q of ['¿Qué pasa si empatan? ¿Hay prórroga y penaltis?','¿Cuál es la alineación probable del Málaga?','¿Se puede ver gratis o en abierto?']){
            await p.evaluate(q=>{document.getElementById('ia-q').value=q;document.getElementById('ia-form').requestSubmit()},q);
            await p.waitForFunction(()=>!document.querySelector('.ia-pen'),{timeout:60000}).catch(()=>{});
            const r=await p.$$eval('.ia-m.el',x=>x[x.length-1].innerText.replace(/\s+/g,' '));
            out.push('P: '+q+' ## R: '+r.slice(0,420));
          }
          for(const o of out)console.log('::notice::'+o);
          await b.close()})();
          JS
          node t.js
