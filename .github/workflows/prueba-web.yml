name: Prueba web (temporal)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          cd ia && npx -y wrangler@4 deploy --dry-run --outdir out > log.txt 2>&1; echo "rc=$?" >> log.txt
          echo "::notice::$(tail -c 1500 log.txt | tr '\n' ' ')"
