name: Prueba web en directo (temporal)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          npm i -s puppeteer-core@23 >/dev/null 2>&1
          cat > t.js <<'JS'
          const pp=require('puppeteer-core');
          (async()=>{const b=await pp.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});const p=await b.newPage();
          const red=[];p.on('response',r=>{if(/workers.dev|football-data/.test(r.url()))red.push(r.status()+' '+r.url().slice(0,70))});
          const errs=[];p.on('console',m=>{if(m.type()==='error')errs.push(m.text().slice(0,120))});
          await p.goto('https://alexample.github.io/dondeloechan/',{waitUntil:'networkidle2'});
          await p.click('#tab-4');await new Promise(r=>setTimeout(r,4000));
          const tabs=await p.$$eval('.tabs button',x=>x.map(y=>y.innerText.replace(/\s+/g,' ')).join(' / '));
          const vivos=await p.$$eval('#app .match',x=>x.map(y=>y.innerText.replace(/\s+/g,' ')).filter(t=>/EN JUEGO|'|Descanso/i.test(t)).slice(0,10));
          console.log('::notice::TABS: '+tabs+' ## RED: '+red.join(' ; ')+' ## VIVO: '+vivos.join(' | ')+' ## ERR: '+errs.join(' ; '));
          await b.close()})();
          JS
          node t.js
