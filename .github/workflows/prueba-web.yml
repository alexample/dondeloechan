name: Prueba web (temporal)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          B=https://dondeloechan-ia.alexample.workers.dev/partido
          q(){ curl -s -H 'X-App: dondeloechan' "$B?$1" | head -c 260; }
          echo "::notice::BAR-RMA $(q 'liga=1&fecha=20261025&local=FC%20Barcelona&visitante=Real%20Madrid')"
          echo "::notice::SEV-OSA $(q 'liga=1&fecha=20261026&local=Sevilla%20FC&visitante=CA%20Osasuna')"
          echo "::notice::ALC-IBI(rfef, otro día) $(q 'liga=5&fecha=20261025&local=Alcorc%C3%B3n&visitante=UD%20Ibiza')"
          echo "::notice::CUARTE-GIR(copa hoy) $(q 'liga=3&fecha=20261027&local=CD%20Cuarte&visitante=Girona%20FC')"
