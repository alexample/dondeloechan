name: Prueba web (temporal)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          B=https://dondeloechan-ia.alexample.workers.dev/partido
          echo "::notice::ALA-MAL $(curl -s -H 'X-App: dondeloechan' "$B?liga=1&fecha=20261023&local=Deportivo%20Alav%C3%A9s&visitante=M%C3%A1laga%20CF" | head -c 600)"
          echo "::notice::EUR-ZAR $(curl -s -H 'X-App: dondeloechan' "$B?liga=5&fecha=20261023&local=CE%20Europa&visitante=Real%20Zaragoza" | head -c 600)"
          echo "::notice::GRA-VLL $(curl -s -H 'X-App: dondeloechan' "$B?liga=2&fecha=20261023&local=Granada%20CF&visitante=Real%20Valladolid" | head -c 300)"
          echo "::notice::sin cabecera HTTP $(curl -s -o /dev/null -w '%{http_code}' "$B?liga=1&fecha=20261023&local=a&visitante=b")"
