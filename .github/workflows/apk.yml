name: Compilar APK

# Se compila una APK nueva cuando cambia la app (no cuando solo cambia la guía de partidos,
# que la app descarga sola de data/partidos.json).
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "keystore/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon

      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk DondeLoEchan.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dónde lo Echan 1.0.${{ github.run_number }}
          make_latest: "true"
          body: |
            Descarga **DondeLoEchan.apk** desde el móvil y ábrela para instalar.
            Si ya tenías una versión anterior, se instala encima.
          files: DondeLoEchan.apk
